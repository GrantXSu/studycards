      </div>

</div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const C = { k: '#1f2937', r: '#dc2626', b: '#2563eb', o: '#ea580c', g: '#15803d', w: '#ffffff', p: '#7c3aed', s: '#475569' };
function S(tag, a = {}, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function T(p, x, y, s, a = {}) { const e = S('text', { x, y, 'font-size': 15, fill: C.k, 'text-anchor': 'middle', ...a }, p); e.textContent = s; return e; }
function TL(p, x, y, lines, a = {}, lh = 18) { lines.forEach((s, i) => T(p, x, y + i * lh, s, a)); }
function A(p, d, c = 'k', w = 2.5, extra = {}) { return S('path', { d, fill: 'none', stroke: C[c], 'stroke-width': w, 'marker-end': `url(#m-${c})`, ...extra }, p); }
function lin(s, id, stops, vertical) {
  const g = S('linearGradient', { id, x1: 0, y1: 0, x2: vertical ? 0 : 1, y2: vertical ? 1 : 0 }, s.querySelector('defs'));
  stops.forEach(([o, c]) => S('stop', { offset: o, 'stop-color': c }, g));
}
function mix(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  const h = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const [A1, B1] = [h(a), h(b)];
  return 'rgb(' + A1.map((v, i) => Math.round(v + (B1[i] - v) * t)).join(',') + ')';
}

let flows = [];
function flow(p, d, o = {}) {
  const path = S('path', { d, fill: 'none', stroke: o.trail || 'none', 'stroke-width': o.tw || 2, 'stroke-opacity': o.to ?? .25, 'stroke-linecap': 'round' }, p);
  const L = path.getTotalLength();
  const n = o.n || 10, dots = [];
  for (let i = 0; i < n; i++) dots.push(S('circle', { r: o.r || 4, fill: o.color || C.k, stroke: o.stroke || 'none', 'stroke-width': 2 }, p));
  const f = { path, L, dots, dur: o.dur || 6, speed: o.speed ?? 1, phase: Math.random(), colorFn: o.colorFn };
  flows.push(f);
  return f;
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (const f of flows) {
    f.phase = (f.phase + dt * f.speed / f.dur) % 1;
    f.dots.forEach((c, i) => {
      const u = (f.phase + i / f.dots.length) % 1, pt = f.path.getPointAtLength(u * f.L);
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
      if (f.colorFn) c.setAttribute('fill', f.colorFn(pt));
    });
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function newSvg() {
  const box = document.getElementById('scene'); box.innerHTML = ''; flows = [];
  const s = S('svg', { viewBox: '0 0 800 450' }); box.appendChild(s);
  const defs = S('defs', {}, s);
  for (const k in C) {
    const m = S('marker', { id: 'm-' + k, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' }, defs);
    S('path', { d: 'M0,0 L10,5 L0,10 z', fill: C[k] }, m);
  }
  return s;
}
// rounded-rectangle loops; CW = up the left side, right along the top (on screen)
function loopCW(x1, y1, x2, y2, r) { return `M${x1},${y2 - r} L${x1},${y1 + r} Q${x1},${y1} ${x1 + r},${y1} L${x2 - r},${y1} Q${x2},${y1} ${x2},${y1 + r} L${x2},${y2 - r} Q${x2},${y2} ${x2 - r},${y2} L${x1 + r},${y2} Q${x1},${y2} ${x1},${y2 - r}`; }
function loopCCW(x1, y1, x2, y2, r) { return `M${x1},${y1 + r} L${x1},${y2 - r} Q${x1},${y2} ${x1 + r},${y2} L${x2 - r},${y2} Q${x2},${y2} ${x2},${y2 - r} L${x2},${y1 + r} Q${x2},${y1} ${x2 - r},${y1} L${x1 + r},${y1} Q${x1},${y1} ${x1},${y1 + r}`; }
function spiralD(cx, cy, R, r0, a0, turn) {
  let d = '';
  for (let i = 0; i <= 48; i++) { const t = i / 48, r = R - (R - r0) * t, a = a0 + turn * t; d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy - r * Math.sin(a)).toFixed(1); }
  return d;
}
function cloud(p, x, y, s = 1, rain = true, fill = '#e2e8f0') {
  const g = S('g', { transform: `translate(${x},${y}) scale(${s})` }, p);
  if (rain) for (let i = -2; i <= 2; i++) S('line', { x1: i * 11, y1: 22, x2: i * 11 - 5, y2: 44, stroke: C.b, 'stroke-width': 2.5, 'stroke-linecap': 'round' }, g);
  [[-22, 6, 16], [0, -4, 21], [22, 6, 16], [0, 10, 18]].forEach(([dx, dy, r]) => S('circle', { cx: dx, cy: dy, r, fill }, g));
  return g;
}
function fish(p, x, y) {
  S('path', { d: `M${x + 12},${y} L${x + 20},${y - 6} L${x + 20},${y + 6} Z`, fill: '#fde68a' }, p);
  S('ellipse', { cx: x, cy: y, rx: 13, ry: 6, fill: '#fde68a' }, p);
  S('circle', { cx: x - 7, cy: y - 1, r: 1.6, fill: C.k }, p);
}
function sun(p, x, y, r = 15) {
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; S('line', { x1: x + Math.cos(a) * (r + 4), y1: y + Math.sin(a) * (r + 4), x2: x + Math.cos(a) * (r + 11), y2: y + Math.sin(a) * (r + 11), stroke: '#f59e0b', 'stroke-width': 3, 'stroke-linecap': 'round' }, p); }
  S('circle', { cx: x, cy: y, r, fill: '#facc15' }, p);
}

/* ---------- 1. CELLS (side view, equator → pole) ---------- */
const X = l => 70 + l * 7.333;
function cellsScene(s, stage) {
  lin(s, 'sky', [['0', '#dbeafe'], ['1', '#f0f9ff']], true);
  lin(s, 'heat', [['0', '#ef4444'], ['0.35', '#f59e0b'], ['0.7', '#86efac'], ['1', '#bfdbfe']]);
  S('rect', { x: 0, y: 0, width: 800, height: 450, fill: 'url(#sky)' }, s);
  S('rect', { x: 0, y: 380, width: 800, height: 70, fill: 'url(#heat)', opacity: .85 }, s);
  S('line', { x1: 30, y1: 110, x2: 780, y2: 110, stroke: '#64748b', 'stroke-dasharray': '6 5' }, s);
  T(s, 520, 103, 'top of the troposphere (about 8 miles up)', { fill: C.s, 'font-size': 13 });
  [[0, '0° Equator'], [30, '30°'], [60, '60°'], [90, '90° Pole']].forEach(([l, t]) => {
    S('line', { x1: X(l), y1: 380, x2: X(l), y2: 392, stroke: C.k, 'stroke-width': 2 }, s);
    T(s, Math.max(X(l), 52), 410, t, { 'font-weight': 700 });
  });
  if (stage === 0) {
    T(s, 70, 436, 'HOTTEST: direct sun', { 'font-size': 13, 'font-weight': 700, fill: '#991b1b', 'text-anchor': 'start' });
    T(s, 780, 436, 'COLDEST: low-angle sun', { 'font-size': 13, 'font-weight': 700, fill: '#1e3a8a', 'text-anchor': 'end' });
    flow(s, 'M95,375 L95,122', { n: 7, color: C.o, r: 5, dur: 4 });
    flow(s, 'M125,375 L125,122', { n: 7, color: C.o, r: 5, dur: 4.6 });
    TL(s, 230, 230, ['hot air near the equator', 'gets lighter and RISES'], { 'font-weight': 700, fill: C.o });
    A(s, 'M180,225 L140,225', 'o', 2.5);
    return;
  }
  flow(s, loopCW(X(0) + 18, 140, X(30) - 18, 362, 30), { n: 16, color: C.o, r: 5, dur: 9, trail: C.o, tw: 3 });
  T(s, X(15), 260, 'HADLEY CELL', { 'font-weight': 800, fill: C.o });
  cloud(s, 110, 150, 1);
  S('path', { d: `M${X(30) - 50},380 Q${X(30)},352 ${X(30) + 50},380 Z`, fill: '#fcd34d' }, s);
  const lab = (l, a, b, c) => { const x = Math.min(Math.max(X(l), 60), 745); T(s, x, 32, a, { 'font-weight': 800, fill: c }); T(s, x, 52, b, { 'font-size': 13, fill: C.s }); };
  lab(0, 'RISES', 'cools → rain', C.b);
  lab(30, 'SINKS', 'warms → dry', C.o);
  if (stage >= 2) {
    flow(s, loopCCW(X(30) + 18, 140, X(60) - 18, 362, 30), { n: 16, color: C.g, r: 5, dur: 9, trail: C.g, tw: 3 });
    flow(s, loopCW(X(60) + 18, 140, X(90) - 18, 362, 30), { n: 16, color: C.b, r: 5, dur: 9, trail: C.b, tw: 3 });
    T(s, X(45), 260, 'FERREL CELL', { 'font-weight': 800, fill: C.g });
    T(s, X(75), 260, 'POLAR CELL', { 'font-weight': 800, fill: C.b });
    cloud(s, X(60), 150, 1);
    S('rect', { x: X(90) - 70, y: 374, width: 80, height: 8, fill: '#f8fafc', rx: 3 }, s);
    lab(60, 'RISES', 'cools → rain', C.b);
    lab(90, 'SINKS', 'cold & dry', C.o);
  }
  if (stage >= 3) {
    [[0, 'LOW'], [30, 'HIGH'], [60, 'LOW'], [90, 'HIGH']].forEach(([l, t]) => T(s, Math.min(Math.max(X(l), 60), 745), 72, t + ' pressure', { 'font-size': 13, 'font-weight': 700, fill: t === 'LOW' ? C.b : C.o }));
    [[0, 'rainforest'], [30, 'deserts'], [60, 'temperate & boreal forest'], [90, 'ice & tundra']].forEach(([l, t]) => T(s, Math.min(Math.max(X(l), 52), 740), 436, t, { 'font-size': 13, 'font-weight': 700, fill: '#14532d' }));
    [[15, 'surface: trade winds'], [45, 'surface: westerlies'], [75, 'surface: polar easterlies']].forEach(([l, t]) => T(s, X(l), 376, t, { 'font-size': 12, fill: C.k }));
  }
}

/* ---------- 2. WINDS / CORIOLIS (map view) ---------- */
const Y = l => 225 - l * 2.3;
function windBase(s) {
  const band = (a, b, c) => S('rect', { x: 0, y: Y(b), width: 800, height: Y(a) - Y(b), fill: c }, s);
  band(60, 90, '#e0f2fe'); band(30, 60, '#dcfce7'); band(0, 30, '#fef9c3');
  band(-30, 0, '#fef9c3'); band(-60, -30, '#dcfce7'); band(-90, -60, '#e0f2fe');
  S('rect', { x: 0, y: Y(4), width: 800, height: Y(-4) - Y(4), fill: '#fecaca' }, s);
  [60, 30, 0, -30, -60].forEach(l => {
    S('line', { x1: 0, y1: Y(l), x2: 800, y2: Y(l), stroke: '#94a3b8', 'stroke-dasharray': '5 5' }, s);
    T(s, 8, Y(l) - 5, l === 0 ? '0° equator' : Math.abs(l) + '°' + (l > 0 ? 'N' : 'S'), { 'text-anchor': 'start', 'font-size': 13, 'font-weight': 700, fill: C.s });
  });
  [[88, 'H polar high'], [60, 'L subpolar low'], [30, 'H subtropical high'], [0, 'L ITCZ'], [-30, 'H subtropical high'], [-60, 'L subpolar low'], [-88, 'H polar high']].forEach(([l, t]) =>
    T(s, 792, Y(l) + (Math.abs(l) === 88 ? (l > 0 ? 12 : -2) : -5), t, { 'text-anchor': 'end', 'font-size': 12, 'font-weight': 700, fill: t[0] === 'H' ? C.o : C.b }));
  T(s, 400, 14, 'W ←  map view, north is up  → E', { 'font-size': 12, fill: C.s });
}
const XS = [260, 420, 580];
function straightWinds(s, south) {
  const sg = south ? -1 : 1;
  XS.forEach(x => {
    A(s, `M${x},${Y(sg * 27)} L${x},${Y(sg * 5)}`, 's', 2, { 'stroke-dasharray': '5 4', opacity: .6 });
    A(s, `M${x - 60},${Y(sg * 33)} L${x - 60},${Y(sg * 55)}`, 's', 2, { 'stroke-dasharray': '5 4', opacity: .6 });
    A(s, `M${x + 40},${Y(sg * 87)} L${x + 40},${Y(sg * 65)}`, 's', 2, { 'stroke-dasharray': '5 4', opacity: .6 });
  });
}
function curvedWinds(s, south) {
  const sg = south ? -1 : 1;
  XS.forEach(x => {
    const tr = `M${x},${Y(sg * 27)} Q${x},${Y(sg * 13)} ${x - 120},${Y(sg * 3)}`;
    const we = `M${x - 60},${Y(sg * 33)} Q${x - 60},${Y(sg * 47)} ${x + 60},${Y(sg * 57)}`;
    const po = `M${x + 40},${Y(sg * 87)} Q${x + 40},${Y(sg * 76)} ${x - 80},${Y(sg * 63)}`;
    A(s, tr, 'o', 2.5, { opacity: .55 }); A(s, we, 'g', 2.5, { opacity: .55 }); A(s, po, 'b', 2.5, { opacity: .55 });
    flow(s, tr, { n: 4, color: C.o, r: 4.5, dur: 3.5 });
    flow(s, we, { n: 4, color: C.g, r: 4.5, dur: 3.5 });
    flow(s, po, { n: 4, color: C.b, r: 4.5, dur: 3.5 });
  });
  const lb = (l, t, c) => T(s, 712, Y(l) + 5, t, { 'font-size': 14, 'font-weight': 800, fill: c });
  if (!south) { lb(16, 'NE trade winds', C.o); lb(45, 'westerlies', C.g); lb(75, 'polar easterlies', C.b); }
  else { lb(-16, 'SE trade winds', C.o); lb(-45, 'westerlies', C.g); lb(-75, 'polar easterlies', C.b); }
}
function windScene(s, stage) {
  windBase(s);
  if (stage === 0) { straightWinds(s, false); straightWinds(s, true); T(s, 712, Y(45), 'no spin:', { 'font-weight': 700, fill: C.s }); T(s, 712, Y(45) + 18, 'straight N or S', { 'font-weight': 700, fill: C.s }); return; }
  straightWinds(s, false); curvedWinds(s, false);
  if (stage >= 2) { straightWinds(s, true); curvedWinds(s, true); T(s, 712, Y(0) + 5, '→ converge ←', { 'font-size': 13, 'font-weight': 800, fill: '#991b1b' }); }
  else T(s, 400, Y(-45), 'Southern Hemisphere: next step', { fill: C.s, 'font-size': 14 });
}

/* ---------- 3. TWO KINDS OF SPIN ---------- */
function spinScene(s, stage) {
  S('rect', { x: 0, y: 0, width: 400, height: 450, fill: '#e0f2fe' }, s);
  S('rect', { x: 400, y: 0, width: 400, height: 450, fill: stage >= 2 ? '#cfe8ff' : '#f1f5f9' }, s);
  T(s, 200, 30, 'A STORM: air rushing INTO a low', { 'font-weight': 800 });
  const cx = 200, cy = 245;
  if (stage === 0) {
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; A(s, `M${cx + 160 * Math.cos(a)},${cy - 160 * Math.sin(a)} L${cx + 45 * Math.cos(a)},${cy - 45 * Math.sin(a)}`, 's', 2.5, { 'stroke-dasharray': '6 4' }); }
    T(s, 200, 430, 'air moves straight in (no spin yet)', { fill: C.s });
  } else {
    for (let k = 0; k < 8; k++) {
      const d = spiralD(cx, cy, 165, 28, k * Math.PI / 4, 1.9);
      A(s, d, 'b', 2, { opacity: .45 });
      flow(s, d, { n: 4, color: C.b, r: 4.5, dur: 4 });
    }
    T(s, 200, 430, 'each stream curves RIGHT → COUNTERCLOCKWISE', { 'font-weight': 800, fill: C.b, 'font-size': 14 });
  }
  T(s, cx, cy + 12, 'L', { 'font-size': 38, 'font-weight': 900, fill: C.b });
  if (stage >= 2) {
    T(s, 600, 30, 'A GYRE: water pushed by 2 wind belts', { 'font-weight': 800 });
    S('rect', { x: 430, y: 120, width: 18, height: 260, fill: '#86efac' }, s);
    S('rect', { x: 752, y: 120, width: 18, height: 260, fill: '#86efac' }, s);
    A(s, 'M500,92 L700,92', 'g', 4); T(s, 600, 78, 'westerlies push the top EAST', { 'font-size': 13, 'font-weight': 700, fill: C.g });
    A(s, 'M700,408 L500,408', 'o', 4); T(s, 600, 432, 'trade winds push the bottom WEST', { 'font-size': 13, 'font-weight': 700, fill: C.o });
    const d = loopCW(470, 130, 730, 370, 50);
    S('path', { d, fill: 'none', stroke: C.p, 'stroke-width': 3, opacity: .35 }, s);
    flow(s, d, { n: 22, color: C.p, r: 5, dur: 10 });
    T(s, 600, 245, 'CLOCKWISE', { 'font-size': 22, 'font-weight': 900, fill: C.p });
    T(s, 600, 268, '“opposite of Coriolis”', { 'font-size': 13, fill: C.s });
  } else T(s, 600, 240, '(next step)', { fill: '#94a3b8' });
}

/* ---------- 4. HURRICANES ---------- */
function hurrTop(s) {
  S('rect', { x: 0, y: 0, width: 800, height: 450, fill: '#1e3a5f' }, s);
  const cx = 340, cy = 225;
  for (let k = 0; k < 5; k++) {
    const d = spiralD(cx, cy, 205, 30, k * 2 * Math.PI / 5, 2.7);
    S('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 20, opacity: .2, 'stroke-linecap': 'round' }, s);
    flow(s, d, { n: 6, color: '#fff', r: 3.5, dur: 4.5 });
  }
  S('circle', { cx, cy, r: 24, fill: '#1e3a5f', stroke: '#fff', 'stroke-width': 7, opacity: .95 }, s);

        o: ['The air over the Sahara is sinking air that already lost its moisture over the equator, and it warms as it is compressed',

  { name: 'Winds & Coriolis', steps: [

    { t: 'Earth spins: the Coriolis effect', d: s => windScene(s, 1),
      b: `<p>Earth spins toward the east, and the ground at the equator moves fastest (about 1,670 km/h). Air moving across the spinning planet gets <b>deflected</b>.</p><div class="key">Northern Hemisphere: moving air curves to its RIGHT.</div><p>Trick: <b>face where the air is going, then turn right.</b></p><ul><li>Hadley surface air heads <b>south</b> → curves <b>west</b> → comes from the <b>northeast</b> = <b>NE trade winds</b></li><li>Ferrel surface air heads <b>north</b> → curves <b>east</b> → comes from the <b>west</b> = <b>westerlies</b></li><li>Polar surface air heads <b>south</b> → curves <b>west</b> → comes from the <b>east</b> = <b>polar easterlies</b></li></ul><p>Winds are named for where they come <b>from</b>.</p>` },

  { name: 'Two kinds of spin', steps: [

    { t: 'Every stream curves right → the storm spins counterclockwise', d: s => spinScene(s, 1),

  { name: 'Hurricanes', steps: [
    { t: 'A hurricane is a giant low', d: hurrTop,

      slide: 'D. Hurricanes\n1. Caused by low pressure systems ⇨ driven by heat from the ocean' },
    { t: 'The engine: heat from the ocean', d: hurrSide,
      b: `<p>This is a side view cut through the middle of the storm.</p><ol><li><b>Warm ocean water</b> (at least about 26.5 °C / 80 °F) evaporates into the air.</li><li>That warm, moist air spirals in and <b>rises</b> in the eyewall.</li><li>As it rises, it cools and the water vapor <b>condenses</b>. Condensing releases <b>heat</b>, so the air rises even faster.</li><li>Faster rising → <b>lower pressure</b> in the center → more air rushes in. That's a <b>positive feedback loop</b>.</li></ol><p>Cut off the warm water (the storm moves over land or cold water) and the engine dies.</p>` },

  { name: 'Gyres & currents', steps: [

    { t: 'Two flows, opposite directions', d: s => gyreScene(s, 1),
      b: `<p>The trade winds push the southern part of the ocean <b>west</b>. The westerlies push the northern part <b>east</b>.</p><p>But each flow runs straight into a continent. Where can the water go?</p>` },
    { t: 'The continents turn it into a loop', d: s => gyreScene(s, 2),
      b: `<p>The water hits North America and turns <b>north</b>. It hits Europe/Africa and turns <b>south</b>. The result is one giant loop filling the whole ocean basin: a <b>gyre</b>.</p><div class="key">Northern Hemisphere gyres turn CLOCKWISE.</div>` },
    { t: 'Warm side, cold side', d: s => gyreScene(s, 3),
      b: `<p>Watch the dot colors:</p><ul><li>On the <b>west side</b> of the ocean (the <b>east coast</b> of North America), the water flows <b>north out of the tropics</b>, so it's <b>warm</b>. That's the <b>Gulf Stream</b>.</li><li>On the <b>east side</b> of the ocean (the <b>west coast</b> of Europe/Africa), it flows <b>south from the cold north</b>, so it's <b>cold</b>. That's the Canary Current.</li></ul><p>Along those west coasts, winds and Earth's spin also push surface water away from shore, so cold deep water <b>upwells</b> → nutrients → big fisheries.</p><p>Same pattern in the Pacific: the cold <b>California Current</b> runs down your coast in Washington.</p>`,
      slide: '2. Cold water from the poles moves along the west coasts of continents ⇨ cools adjacent land mass\n3. Warm water from the equator moves along the east coasts of continents ⇨ warms adjacent land mass\n4. Upwellings occur along west coasts of most continents ⇨ result in increased nutrients and fish populations' },

  { name: 'El Niño', steps: [
    { t: 'A normal year', d: s => { ensoMode = 'normal'; ensoScene(s); },
      b: `<p>This is a side view along the equator across the Pacific.</p><ol><li>The <b>trade winds</b> blow from east to west and drag warm surface water <b>west</b>.</li><li>Warm water <b>piles up</b> near Indonesia and Australia: a thick warm layer, with sea level about ½ m higher.</li><li>Near Peru, the warm water has been pushed away, so <b>cold, nutrient-rich water rises</b> to replace it (<b>upwelling</b>) → a huge anchovy fishery.</li><li>Air over the warm west <b>rises → rain</b>. Air over the cold east <b>sinks → dry</b>. That air loop drives the trade winds, so the system keeps itself going.</li></ol><p>The dashed line is the <b>thermocline</b>, the boundary between the warm top layer and the cold deep water.</p>`,

    { t: 'El Niño', d: s => { ensoMode = 'nino'; ensoScene(s); },
      b: `<p>Every 2–7 years, the <b>trade winds weaken</b> (and sometimes even reverse).</p><ol><li>Nothing holds the warm water in the west anymore, so it <b>sloshes east</b> toward Peru.</li><li>The warm layer off Peru gets <b>thick</b>. The thermocline is pushed deep, so upwelling only brings up warm, nutrient-poor water → <b>fisheries crash</b>.</li><li>The rain follows the warm water: air <b>rises over Peru → flooding</b>, and air sinks over the west → <b>drought in Australia and Indonesia</b>.</li></ol>`,
      slide: 'F. ENSO\n1. A periodic weakening of the Trade Winds ⇨ results in a warming of the Pacific Ocean off the coast of Peru\n2. Changes weather patterns around the globe: a. Warm, dry winters in the northwestern U.S.  b. Cool, wet winters in the southwestern U.S.  c. Flooding in Peru  d. Drought in Australia and Indonesia',
      fx: 'nino' },
    { t: 'La Niña', d: s => { ensoMode = 'nina'; ensoScene(s); },

    { t: 'Compare all three', d: s => ensoScene(s),
      b: `<p>Switch between them and watch four things change: the trade winds, the thermocline, the upwelling, and where the rain falls.</p><div class="mbtns"><button class="btn" data-m="normal">Normal</button><button class="btn" data-m="nino">El Niño</button><button class="btn" data-m="nina">La Niña</button></div>`,
      slide: 'Slide 19: since the “climatic shift of 1976-77,” El Niño episodes have been more frequent and persistent than the cooler La Niñas. It is unclear if this change is related to global climate change.',

      q: { q: 'During an El Niño year, a scientist off Peru measures the thermocline. Compared with a normal year, she most likely finds that...',

        why: 'Weak trade winds let warm water slosh east and pile up off Peru, pushing the thermocline DOWN. Upwelling then only reaches warm, nutrient-poor water. C has the right depth but the wrong cause: stronger trade winds is La Niña.' } },

  { name: 'Thermohaline', steps: [
    { t: 'What makes water sink', d: densityScene,
      b: `<p><b>Thermo</b> = temperature, <b>haline</b> = salt. These two things decide how dense (heavy) seawater is:</p><div class="key">Colder = denser. Saltier = denser. Dense water SINKS.</div><p>The coldest, saltiest water in the ocean sinks all the way to the bottom. Near Greenland, forming sea ice leaves its salt behind in the water, so the water there is extra cold <b>and</b> extra salty.</p>` },
    { t: 'The Great Conveyor Belt', d: s => { melted = false; conveyorScene(s, 1); },
      b: `<p>That sinking water drives a slow loop through every ocean:</p><ol><li><b>Sinks</b> in the North Atlantic (cold + salty)</li><li>Flows along the deep ocean floor south to Antarctica, then into the Indian and Pacific Oceans</li><li>Slowly warms and <b>rises</b> near the equator</li><li>Returns at the surface to the North Atlantic, where it cools, sinks, and repeats</li></ol><p>One trip takes about <b>1,000 years</b>. Unlike gyres, it's driven by <b>density</b>, not wind.</p><p class="small muted">This is a simplified loop, not a real map.</p>`,
      slide: '5. Thermohaline circulation ⇨ results from cold salty water sinking at high latitudes and warm water rising near the equator (aka: The Great Conveyor Belt)' },
    { t: 'Why it matters', d: s => { melted = false; conveyorScene(s, 2); },
      b: `<ul><li><b>Moves heat:</b> warm surface water (including the Gulf Stream) carries heat north, so England is mild even though it's farther north than most of Canada.</li><li><b>Moves oxygen down</b> into the deep ocean when water sinks.</li><li><b>Moves nutrients up</b> when deep water rises.</li></ul>`,
      slide: 'a. Ex: Gulf Stream warms England, while Newfoundland is cooled by North Atlantic current' },
    { t: 'What if Greenland melts?', d: s => conveyorScene(s, 2),
      b: `<p>Press the button. Melting Greenland ice pours <b>fresh</b> water into the North Atlantic:</p><div class="key">fresher → less dense → less sinking → conveyor slows → less warm water pulled north → Europe gets COLDER</div><p>Think of the sinking as a bathtub drain that pulls warm water north. Clog the drain, and the warm water stops coming.</p><button class="btn primary" id="melt">Melt Greenland's ice</button>`,
      slide: 'b. Global climate change could shut down the circulation', melt: true },
    { t: 'Surface currents vs. thermohaline', d: s => { melted = false; conveyorScene(s, 2); },
      b: `<table class="cmp"><tr><th></th><th>Surface currents (gyres)</th><th>Thermohaline</th></tr><tr><th>Driven by</th><td>Wind</td><td>Density (temperature + salt)</td></tr><tr><th>Where</th><td>Top few hundred meters</td><td>Top to bottom, the deep ocean</td></tr><tr><th>Size</th><td>One ocean basin</td><td>The whole planet</td></tr><tr><th>Speed</th><td>Fairly fast</td><td>Very slow (~1,000 years)</td></tr></table>`,

      q: { q: 'Which sequence correctly links a cause to its effects?',
        o: ['Weaker trade winds → less upwelling off Peru → fewer anchovies',

];

/* ---------- UI ---------- */
let st = { c: 0, s: 0 };
try { Object.assign(st, JSON.parse(localStorage.scCirc || '{}')); } catch {}
if (!CH[st.c] || !CH[st.c].steps[st.s]) st = { c: 0, s: 0 };
const seen = new Set(JSON.parse(localStorage.scCircSeen || '[]'));

function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function order(q) { const idx = q.o.map((_, i) => i); let h = hash(q.q); for (let i = idx.length - 1; i > 0; i--) { h = Math.imul(h, 1103515245) + 12345 >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }

function drawScene() { const step = CH[st.c].steps[st.s]; step.d(newSvg()); }
function render() {
  const ch = CH[st.c], step = ch.steps[st.s];
  localStorage.scCirc = JSON.stringify(st);
  if (st.s === ch.steps.length - 1) { seen.add(st.c); localStorage.scCircSeen = JSON.stringify([...seen]); }
  document.getElementById('chap').innerHTML = CH.map((c, i) => `<button class="${i === st.c ? 'on' : ''} ${seen.has(i) ? 'done' : ''}" data-c="${i}">${i + 1}. ${c.name}</button>`).join('');
  let html = `<div class="small muted">Chapter ${st.c + 1} of ${CH.length}: ${ch.name} · step ${st.s + 1} of ${ch.steps.length}</div><h2>${step.t}</h2>${step.b}`;
  if (step.fx) html += `<div class="fx" id="fx"></div>`;
  if (step.slide) html += `<div class="slide"><b>Your slide:</b>\n${step.slide}</div>`;
  if (step.q) {
    html += `<div class="ck"><div class="small muted" style="font-weight:700">CHECK YOURSELF (AP-style)</div><div class="qq">${step.q.q}</div>` +
      order(step.q).map((i, k) => `<button class="ckopt" data-i="${i}">${'ABCD'[k]}. ${step.q.o[i]}</button>`).join('') + `<div class="ckfb" id="ckfb"></div></div>`;
  }
  const body = document.getElementById('body');
  body.innerHTML = html;
  drawScene();
  const setFx = () => { const el = document.getElementById('fx'); if (el) el.innerHTML = FX[step.fx === 'live' ? ensoMode : step.fx]; };
  setFx();
  body.querySelectorAll('[data-m]').forEach(b => {
    b.classList.toggle('on', b.dataset.m === ensoMode);
    b.onclick = () => { ensoMode = b.dataset.m; body.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); drawScene(); setFx(); };
  });
  const melt = document.getElementById('melt');
  if (melt) {
    melted = false; drawScene();
    melt.onclick = () => { melted = !melted; melt.textContent = melted ? 'Refreeze (reset)' : "Melt Greenland's ice"; drawScene(); };
  }
  body.querySelectorAll('.ckopt').forEach(b => b.onclick = () => {
    const right = +b.dataset.i === 0;
    body.querySelectorAll('.ckopt').forEach(x => { if (+x.dataset.i === 0) x.classList.add('ok'); x.disabled = true; });
    if (!right) b.classList.add('bad');
    document.getElementById('ckfb').innerHTML = (right ? '<b style="color:var(--ok)">Correct.</b> ' : '<b style="color:var(--bad)">Not quite.</b> ') + step.q.why;
  });
  document.getElementById('dots').innerHTML = ch.steps.map((_, i) => `<i class="${i === st.s ? 'on' : ''}"></i>`).join('');
  document.getElementById('back').disabled = st.c === 0 && st.s === 0;
  const lastStep = st.s === ch.steps.length - 1;
  document.getElementById('next').textContent = lastStep ? (st.c < CH.length - 1 ? 'Next chapter →' : 'Done ✓') : 'Next →';
  document.getElementById('next').disabled = lastStep && st.c === CH.length - 1;
}
function go(c, s) { st = { c, s }; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
document.getElementById('chap').onclick = e => { const b = e.target.closest('[data-c]'); if (b) go(+b.dataset.c, 0); };
document.getElementById('next').onclick = () => { const ch = CH[st.c]; if (st.s < ch.steps.length - 1) go(st.c, st.s + 1); else if (st.c < CH.length - 1) go(st.c + 1, 0); };
document.getElementById('back').onclick = () => { if (st.s > 0) go(st.c, st.s - 1); else if (st.c > 0) go(st.c - 1, CH[st.c - 1].steps.length - 1); };
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') document.getElementById('next').click(); if (e.key === 'ArrowLeft') document.getElementById('back').click(); });
if (localStorage.scTheme === 'dark') document.body.classList.add('dark');
document.getElementById('theme').onclick = () => { const d = document.body.classList.toggle('dark'); localStorage.scTheme = d ? 'dark' : 'light'; };
render();
</script>
