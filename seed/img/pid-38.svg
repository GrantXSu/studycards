<svg xmlns="http://www.w3.org/2000/svg" width="230" height="200" class="dia" viewBox="0 0 230 200" role="img" aria-label="Mystery molecule"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
