<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="535" fill="#ffffff"/><text x="450" y="26.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">Designing protected areas (island biogeography + edge effects)</text><text x="250" y="58.0" font-size="15" fill="#1b5e20" text-anchor="middle" font-weight="bold">BETTER (more species persist)</text><text x="680" y="58.0" font-size="15" fill="#b71c1c" text-anchor="middle" font-weight="bold">WORSE</text><circle cx="250" cy="120" r="48" fill="#81c784" stroke="none" stroke-width="1.5"/><circle cx="650" cy="120" r="16" fill="#81c784" stroke="none" stroke-width="1.5"/><circle cx="710" cy="120" r="16" fill="#81c784" stroke="none" stroke-width="1.5"/><text x="450" y="116.0" font-size="11.5" fill="#333" text-anchor="middle">Bigger area: bigger populations,</text><text x="450" y="130.0" font-size="11.5" fill="#333" text-anchor="middle">more habitats + niches</text><circle cx="215" cy="225" r="26" fill="#81c784" stroke="none" stroke-width="1.5"/><circle cx="285" cy="225" r="26" fill="#81c784" stroke="none" stroke-width="1.5"/><circle cx="600" cy="225" r="26" fill="#81c784" stroke="none" stroke-width="1.5"/><circle cx="770" cy="225" r="26" fill="#81c784" stroke="none" stroke-width="1.5"/><text x="450" y="221.0" font-size="11.5" fill="#333" text-anchor="middle">Close together / near the "mainland":</text><text x="450" y="235.0" font-size="11.5" fill="#333" text-anchor="middle">more species can disperse in</text><circle cx="200" cy="330" r="26" fill="#81c784" stroke="none" stroke-width="1.5"/><rect x="224" y="324" width="52" height="12" rx="0" fill="#81c784" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="300" cy="330" r="26" fill="#81c784" stroke="none" stroke-width="1.5"/><circle cx="620" cy="330" r="26" fill="#81c784" stroke="none" stroke-width="1.5"/><circle cx="730" cy="330" r="26" fill="#81c784" stroke="none" stroke-width="1.5"/><text x="675" y="336.0" font-size="11" fill="#555" text-anchor="middle">farm / city</text><text x="450" y="326.0" font-size="11.5" fill="#333" text-anchor="middle">Connected by habitat CORRIDORS:</text><text x="450" y="340.0" font-size="11.5" fill="#333" text-anchor="middle">metapopulations can rescue each other</text><circle cx="250" cy="435" r="40" fill="#81c784" stroke="none" stroke-width="1.5"/><circle cx="250" cy="435" r="22" fill="#1b5e20" stroke="none" stroke-width="1.5"/><rect x="570" y="425" width="220" height="22" rx="0" fill="#a5d6a7" stroke="none" stroke-width="1.5" opacity="1"/><text x="680" y="470.0" font-size="11" fill="#555" text-anchor="middle">long + thin = mostly edge</text><text x="450" y="431.0" font-size="11.5" fill="#333" text-anchor="middle">Compact shape = less EDGE habitat</text><text x="450" y="445.0" font-size="11.5" fill="#333" text-anchor="middle">(edge favors cowbirds, invasives)</text><text x="450" y="505.0" font-size="12" fill="#333" text-anchor="middle">SLOSS debate: Single Large (bigger populations, less edge) Or Several Small</text><text x="450" y="522.0" font-size="12" fill="#333" text-anchor="middle">(one disease or fire can't wipe out every population, but more edge and smaller populations).</text></svg>