 x="900" y="348.0" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">HIGH</text><text x="900" y="363.9" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">cold + dry</text><text x="900" y="379.7" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">(polar)</text><text x="60" y="348.0" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">HIGH</text><text x="60" y="363.9" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">cold + dry</text><text x="60" y="379.7" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">(polar)</text><text x="480" y="450.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Surface winds (Coriolis bends them):</text><line x1="610" y1="472" x2="490" y2="472" stroke="#ef6c00" stroke-width="3" marker-end="url(#ao)"/><text x="550.0" y="494.0" font-size="13" fill="#e65100" text-anchor="middle">NE trade winds</text><line x1="350" y1="472" x2="470" y2="472" stroke="#ef6c00" stroke-width="3" marker-end="url(#ao)"/><text x="410.0" y="494.0" font-size="13" fill="#e65100" text-anchor="middle">SE trade winds</text><line x1="630" y1="472" x2="750" y2="472" stroke="#ef6c00" stroke-width="3" marker-end="url(#ao)"/><text x="690.0" y="494.0" font-size="13" fill="#e65100" text-anchor="middle">westerlies</text><line x1="330" y1="472" x2="210" y2="472" stroke="#ef6c00" stroke-width="3" marker-end="url(#ao)"/><text x="270.0" y="494.0" font-size="13" fill="#e65100" text-anchor="middle">westerlies</text><line x1="890" y1="472" x2="770" y2="472" stroke="#ef6c00" stroke-width="3" marker-end="url(#ao)"/><text x="830.0" y="494.0" font-size="13" fill="#e65100" text-anchor="middle">polar easterlies</text><line x1="70" y1="472" x2="190" y2="472" stroke="#ef6c00" stroke-width="3" marker-end="url(#ao)"/><text x="130.0" y="494.0" font-size="13" fill="#e65100" text-anchor="middle">polar easterlies</text><text x="480" y="528.0" font-size="13" fill="#444" text-anchor="middle">Order from the equator: Hadley (0-30°), Ferrel (30-60°), Polar (60-90°).  Most of the U.S. is under the westerlies.</text></svg>