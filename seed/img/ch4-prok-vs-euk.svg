<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" class="dia" role="img" aria-label="Prokaryotic vs eukaryotic cells"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dia .ring{stroke:#1f2937;stroke-width:2;fill:none;stroke-linejoin:round}
.dia .ptr{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:3 3}
.dia .hbond{stroke:#2563eb;stroke-width:1.6;stroke-dasharray:3 3}
.dia .hbond2{stroke:#2563eb;stroke-width:2;stroke-dasharray:4 3}
.dia .ss{stroke:#b45309;stroke-width:2.5;stroke-dasharray:4 3}
.dia .hexa{stroke:#374151;stroke-width:1.2}
.dia .chain{stroke:#374151;stroke-width:2;fill:none}
.dia .pchain{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .backbone{stroke:#94a3b8;stroke-width:5}
.dia .dnastr{stroke:#2563eb;stroke-width:3;fill:none}
.dia .rnastr{stroke:#7c3aed;stroke-width:3;fill:none}
.dia .bg{fill:#fff}
.dia .water{fill:rgba(59,130,246,.08);stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="540" fill="#ffffff"/><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="1"/><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="1"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><text x="500.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Prokaryotic vs eukaryotic cells</text><circle cx="350" cy="290" r="232" fill="#d97706" fill-opacity=".16" stroke="#d97706" stroke-width="3"/><circle cx="650" cy="290" r="232" fill="#7c3aed" fill-opacity=".16" stroke="#7c3aed" stroke-width="3"/><text x="255.0" y="150.0" font-size="18" font-weight="800" text-anchor="middle" fill="#d97706" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">PROKARYOTE only</text><text x="745.0" y="150.0" font-size="18" font-weight="800" text-anchor="middle" fill="#7c3aed" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">EUKARYOTE only</text><text x="500.0" y="150.0" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">BOTH</text><text x="262.0" y="248.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nucleoid (DNA not</text><text x="262.0" y="274.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">enclosed by membrane)</text><text x="262.0" y="300.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">capsule, fimbriae</text><text x="262.0" y="326.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">usually 1–5 µm</text><text x="262.0" y="352.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Bacteria &amp; Archaea</text><text x="500.0" y="235.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">plasma membrane</text><text x="500.0" y="261.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">cytosol</text><text x="500.0" y="287.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ribosomes</text><text x="500.0" y="313.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">DNA / chromosomes</text><text x="500.0" y="339.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">flagella (some)</text><text x="500.0" y="365.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">cell wall (some)</text><text x="738.0" y="235.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nucleus (double membrane)</text><text x="738.0" y="261.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nucleolus</text><text x="738.0" y="287.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">membrane organelles:</text><text x="738.0" y="313.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ER, Golgi, lysosome,</text><text x="738.0" y="339.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">mitochondria…</text><text x="738.0" y="365.0" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">10–100 µm</text></svg>