<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="590" fill="#ffffff"/><text x="450" y="22.0" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">Layers of the atmosphere (bottom = Earth's surface)</text><rect x="20" y="30" width="860" height="80" rx="0" fill="#e8eaf6" stroke="#90a4ae" stroke-width="1" opacity="1"/><text x="32" y="58.0" font-size="17" fill="#222" text-anchor="start" font-weight="bold">EXOSPHERE</text><text x="32" y="80.0" font-size="13" fill="#555" text-anchor="start">outer edge, into space</text><text x="250" y="62.0" font-size="14" fill="#555" text-anchor="start">thin gas fades into space</text><text x="560" y="60.0" font-size="14" fill="#222" text-anchor="start">Space shuttle / satellites ("space")</text><rect x="20" y="110" width="860" height="120" rx="0" fill="#fce4ec" stroke="#90a4ae" stroke-width="1" opacity="1"/><text x="32" y="138.0" font-size="17" fill="#222" text-anchor="start" font-weight="bold">THERMOSPHERE</text><text x="32" y="160.0" font-size="13" fill="#555" text-anchor="start">51-310 mi</text><text x="250" y="142.0" font-size="14" fill="#b71c1c" text-anchor="start">temp RISES</text><text x="250" y="159.1" font-size="14" fill="#b71c1c" text-anchor="start">(ions absorb X-rays + UV)</text><text x="560" y="140.0" font-size="14" fill="#222" text-anchor="start">Aurora borealis (northern lights)</text><rect x="20" y="230" width="860" height="90" rx="0" fill="#e0f7fa" stroke="#90a4ae" stroke-width="1" opacity="1"/><text x="32" y="258.0" font-size="17" fill="#222" text-anchor="start" font-weight="bold">MESOSPHERE</text><text x="32" y="280.0" font-size="13" fill="#555" text-anchor="start">32-50 mi</text><text x="250" y="262.0" font-size="14" fill="#0d47a1" text-anchor="start">temp FALLS (coldest layer)</text><text x="560" y="260.0" font-size="14" fill="#222" text-anchor="start">Meteor showers burn up here</text><rect x="20" y="320" width="860" height="110" rx="0" fill="#fff3e0" stroke="#90a4ae" stroke-width="1" opacity="1"/><text x="32" y="348.0" font-size="17" fill="#222" text-anchor="start" font-weight="bold">STRATOSPHERE</text><text x="32" y="370.0" font-size="13" fill="#555" text-anchor="start">up to ~32 mi</text><text x="250" y="352.0" font-size="14" fill="#b71c1c" text-anchor="start">temp RISES</text><text x="250" y="369.1" font-size="14" fill="#b71c1c" text-anchor="start">(ozone absorbs UV)</text><text x="560" y="350.0" font-size="14" fill="#222" text-anchor="start">OZONE LAYER (O3) blocks UV-B, UV-C;</text><text x="560" y="367.1" font-size="14" fill="#222" text-anchor="start">jet stream (class notes)</text><rect x="20" y="430" width="860" height="100" rx="0" fill="#e8f5e9" stroke="#90a4ae" stroke-width="1" opacity="1"/><text x="32" y="458.0" font-size="17" fill="#222" text-anchor="start" font-weight="bold">TROPOSPHERE</text><text x="32" y="480.0" font-size="13" fill="#555" text-anchor="start">5.5-10.5 mi (densest)</text><text x="250" y="462.0" font-size="14" fill="#0d47a1" text-anchor="start">temp FALLS</text><text x="250" y="479.1" font-size="14" fill="#0d47a1" text-anchor="start">as you go up</text><text x="560" y="460.0" font-size="14" fill="#222" text-anchor="start">ALL WEATHER; Mt. Everest;</text><text x="560" y="477.1" font-size="14" fill="#222" text-anchor="start">N2 78%, O2 21%, Ar 1%</text><rect x="20" y="530" width="860" height="14" rx="0" fill="#8d6e63" stroke="none" stroke-width="1.5" opacity="1"/><text x="450" y="560.0" font-size="13" fill="#222" text-anchor="middle">Order from the ground up: Troposphere, Stratosphere, Mesosphere, Thermosphere, Exosphere ("The Silly Monkey Threw Eggs")</text><text x="450" y="578.0" font-size="13" fill="#555" text-anchor="middle">Layers are separated by temperature changes. Tropopause = boundary between troposphere and stratosphere.</text></svg>