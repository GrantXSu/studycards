<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" class="dia" role="img" aria-label="Light microscope vs SEM vs TEM"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dia .ring{stroke:#1f2937;stroke-width:2;fill:none;stroke-linejoin:round}
.dia .ptr{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:3 3}
.dia .hbond{stroke:#2563eb;stroke-width:1.6;stroke-dasharray:3 3}
.dia .hbond2{stroke:#2563eb;stroke-width:2;stroke-dasharray:4 3}
.dia .ss{stroke:#b45309;stroke-width:2.5;stroke-dasharray:4 3}
.dia .hexa{stroke:#374151;stroke-width:1.2}
.dia .chain{stroke:#374151;stroke-width:2;fill:none}
.dia .pchain{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .backbone{stroke:#94a3b8;stroke-width:5}
.dia .dnastr{stroke:#2563eb;stroke-width:3;fill:none}
.dia .rnastr{stroke:#7c3aed;stroke-width:3;fill:none}
.dia .bg{fill:#fff}
.dia .water{fill:rgba(59,130,246,.08);stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1040" height="400" fill="#ffffff"/><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="1"/><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="1"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><text x="520.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Which microscope?</text><rect x="30" y="55" width="320" height="325" rx="14" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="30" y="55" width="320" height="44" rx="14" fill="#2563eb"/><rect x="30" y="85" width="320" height="14" fill="#2563eb"/><text x="190.0" y="84.0" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Light microscope (LM)</text><text x="48.0" y="128.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• visible light + glass lenses</text><text x="48.0" y="154.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• magnifies up to ~1,000×</text><text x="48.0" y="180.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• resolution ≈ 0.2 µm (200 nm)</text><text x="48.0" y="206.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• can view LIVING cells</text><text x="48.0" y="232.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• stains / fluorescent tags</text><text x="48.0" y="258.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• add contrast</text><text x="48.0" y="305.0" font-size="14" font-weight="700" text-anchor="start" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Use it for:</text><text x="48.0" y="328.0" font-size="14" font-weight="500" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">watching a living white blood cell</text><text x="48.0" y="348.0" font-size="14" font-weight="500" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">change shape</text><rect x="370" y="55" width="320" height="325" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="3"/><rect x="370" y="55" width="320" height="44" rx="14" fill="#7c3aed"/><rect x="370" y="85" width="320" height="14" fill="#7c3aed"/><text x="530.0" y="84.0" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Scanning EM (SEM)</text><text x="388.0" y="128.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• electron beam scans the SURFACE</text><text x="388.0" y="154.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• (sample coated in gold)</text><text x="388.0" y="180.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• gives a 3-D-looking image</text><text x="388.0" y="206.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• of the outside</text><text x="388.0" y="232.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• resolution ≈ 2 nm</text><text x="388.0" y="258.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• kills the cells</text><text x="388.0" y="305.0" font-size="14" font-weight="700" text-anchor="start" fill="#7c3aed" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Use it for:</text><text x="388.0" y="328.0" font-size="14" font-weight="500" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">surface texture of a hair, cilia on</text><text x="388.0" y="348.0" font-size="14" font-weight="500" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">a cell</text><rect x="710" y="55" width="320" height="325" rx="14" fill="#fff" stroke="#9333ea" stroke-width="3"/><rect x="710" y="55" width="320" height="44" rx="14" fill="#9333ea"/><rect x="710" y="85" width="320" height="14" fill="#9333ea"/><text x="870.0" y="84.0" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Transmission EM (TEM)</text><text x="728.0" y="128.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• electrons pass THROUGH a</text><text x="728.0" y="154.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• very thin slice</text><text x="728.0" y="180.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• heavy-metal stains</text><text x="728.0" y="206.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• shows INTERNAL structure</text><text x="728.0" y="232.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• resolution ≈ 2 nm</text><text x="728.0" y="258.0" font-size="15" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• kills the cells</text><text x="728.0" y="305.0" font-size="14" font-weight="700" text-anchor="start" fill="#9333ea" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Use it for:</text><text x="728.0" y="328.0" font-size="14" font-weight="500" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">the inside of a mitochondrion,</text><text x="728.0" y="348.0" font-size="14" font-weight="500" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ribosomes on ER</text></svg>