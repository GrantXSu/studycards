<svg xmlns="http://www.w3.org/2000/svg" width="540" height="230" class="dia" viewBox="0 0 540 230" role="img" aria-label="Pyrimidine versus purine bases"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dia .ring{stroke:#1f2937;stroke-width:2;fill:none;stroke-linejoin:round}
.dia .ptr{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:3 3}
.dia .hbond{stroke:#2563eb;stroke-width:1.6;stroke-dasharray:3 3}
.dia .hbond2{stroke:#2563eb;stroke-width:2;stroke-dasharray:4 3}
.dia .ss{stroke:#b45309;stroke-width:2.5;stroke-dasharray:4 3}
.dia .hexa{stroke:#374151;stroke-width:1.2}
.dia .chain{stroke:#374151;stroke-width:2;fill:none}
.dia .pchain{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .backbone{stroke:#94a3b8;stroke-width:5}
.dia .dnastr{stroke:#2563eb;stroke-width:3;fill:none}
.dia .rnastr{stroke:#7c3aed;stroke-width:3;fill:none}
.dia .bg{fill:#fff}
.dia .water{fill:rgba(59,130,246,.08);stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><defs></defs><polygon class="ring" points="110.0,65.0 144.6,85.0 144.6,125.0 110.0,145.0 75.4,125.0 75.4,85.0"/><polygon class="ring" points="340.0,65.0 374.6,85.0 374.6,125.0 340.0,145.0 305.4,125.0 305.4,85.0"/><polygon class="ring" points="374.6,85.0 412.6,72.6 436.2,105.0 412.6,137.4 374.6,125.0"/><rect class="bg" x="137.7" y="115.4" width="13.9" height="19.2" rx="4"/><text class="at" x="144.6" y="125.0" font-size="16"><tspan fill="#2563eb">N</tspan></text><rect class="bg" x="68.4" y="115.4" width="13.9" height="19.2" rx="4"/><text class="at" x="75.4" y="125.0" font-size="16"><tspan fill="#2563eb">N</tspan></text><rect class="bg" x="298.4" y="75.4" width="13.9" height="19.2" rx="4"/><text class="at" x="305.4" y="85.0" font-size="16"><tspan fill="#2563eb">N</tspan></text><rect class="bg" x="333.0" y="135.4" width="13.9" height="19.2" rx="4"/><text class="at" x="340.0" y="145.0" font-size="16"><tspan fill="#2563eb">N</tspan></text><rect class="bg" x="405.7" y="63.0" width="13.9" height="19.2" rx="4"/><text class="at" x="412.6" y="72.6" font-size="16"><tspan fill="#2563eb">N</tspan></text><rect class="bg" x="405.7" y="127.8" width="13.9" height="19.2" rx="4"/><text class="at" x="412.6" y="137.4" font-size="16"><tspan fill="#2563eb">N</tspan></text><text class="lab" x="110.0" y="180.0" style="text-anchor:middle;font-size:14px;font-weight:700;">PYRIMIDINE: 1 ring</text><text class="lab" x="110.0" y="200.0" style="text-anchor:middle;font-size:13px;">C, T (DNA only), U (RNA only)</text><text class="lab" x="360.0" y="180.0" style="text-anchor:middle;font-size:14px;font-weight:700;">PURINE: 2 fused rings</text><text class="lab" x="360.0" y="200.0" style="text-anchor:middle;font-size:13px;">A, G</text><text class="lab" x="270.0" y="222.0" style="text-anchor:middle;font-size:12px;">Memory trick: “CUT the PY” (pyrimidines = C, U, T) · “PURe As Gold” (purines = A, G)</text></svg>