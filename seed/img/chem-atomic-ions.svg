<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" class="dia" role="img" aria-label="Forming cations and anions"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dia .ring{stroke:#1f2937;stroke-width:2;fill:none;stroke-linejoin:round}
.dia .ptr{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:3 3}
.dia .hbond{stroke:#2563eb;stroke-width:1.6;stroke-dasharray:3 3}
.dia .hbond2{stroke:#2563eb;stroke-width:2;stroke-dasharray:4 3}
.dia .ss{stroke:#b45309;stroke-width:2.5;stroke-dasharray:4 3}
.dia .hexa{stroke:#374151;stroke-width:1.2}
.dia .chain{stroke:#374151;stroke-width:2;fill:none}
.dia .pchain{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .backbone{stroke:#94a3b8;stroke-width:5}
.dia .dnastr{stroke:#2563eb;stroke-width:3;fill:none}
.dia .rnastr{stroke:#7c3aed;stroke-width:3;fill:none}
.dia .bg{fill:#fff}
.dia .water{fill:rgba(59,130,246,.08);stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="380" fill="#ffffff"/><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="1"/><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="1"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><text x="500.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ions: move ELECTRONS only (never protons)</text><text x="90.0" y="100.0" font-size="30" font-weight="800" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Na</text><text x="210.0" y="100.0" font-size="18" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">11p⁺ 11e⁻</text><line x1="300" y1="92" x2="380" y2="92" stroke="#2563eb" stroke-width="3" marker-end="url(#ak)"/><text x="340.0" y="82.0" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">lost 1 e⁻</text><text x="470.0" y="100.0" font-size="18" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">11p⁺ 10e⁻</text><text x="590.0" y="100.0" font-size="30" font-weight="800" text-anchor="middle" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Na⁺</text><text x="660.0" y="100.0" font-size="17" font-weight="700" text-anchor="start" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">cation: sodium ion</text><text x="90.0" y="178.0" font-size="30" font-weight="800" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Mg</text><text x="210.0" y="178.0" font-size="18" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">12p⁺ 12e⁻</text><line x1="300" y1="170" x2="380" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#ak)"/><text x="340.0" y="160.0" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">lost 2 e⁻</text><text x="470.0" y="178.0" font-size="18" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">12p⁺ 10e⁻</text><text x="590.0" y="178.0" font-size="30" font-weight="800" text-anchor="middle" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Mg²⁺</text><text x="660.0" y="178.0" font-size="17" font-weight="700" text-anchor="start" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">cation: magnesium ion</text><text x="90.0" y="256.0" font-size="30" font-weight="800" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">F</text><text x="210.0" y="256.0" font-size="18" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">9p⁺ 9e⁻</text><line x1="300" y1="248" x2="380" y2="248" stroke="#dc2626" stroke-width="3" marker-end="url(#ak)"/><text x="340.0" y="238.0" font-size="13" font-weight="700" text-anchor="middle" fill="#dc2626" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">gained 1 e⁻</text><text x="470.0" y="256.0" font-size="18" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">9p⁺ 10e⁻</text><text x="590.0" y="256.0" font-size="30" font-weight="800" text-anchor="middle" fill="#dc2626" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">F⁻</text><text x="660.0" y="256.0" font-size="17" font-weight="700" text-anchor="start" fill="#dc2626" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">anion: fluoride</text><rect x="60" y="300" width="880" height="62" rx="10" fill="#f1f5f9"/><text x="500.0" y="325.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CATION = positive ion (LOST e⁻), usually a metal; name stays the same (Na⁺ = sodium ion).</text><text x="500.0" y="349.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ANION = negative ion (GAINED e⁻), usually a nonmetal; name ends in “-ide” (Cl⁻ = chloride, O²⁻ = oxide).</text></svg>