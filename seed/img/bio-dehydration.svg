.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><defs><marker id="m40a16a34a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m40aea580c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect x="20.0" y="50.0" width="115.0" height="50.0" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text class="at" x="77.5" y="75.0" font-size="14" fill="#1e3a8a">monomer</text><line class="b" x1="135.0" y1="75.0" x2="165.0" y2="75.0"/><line class="b" x1="236.0" y1="75.0" x2="262.0" y2="75.0"/><rect x="262.0" y="50.0" width="115.0" height="50.0" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text class="at" x="319.5" y="75.0" font-size="14" fill="#1e3a8a">monomer</text><line x1="400" y1="75" x2="478" y2="75" stroke="#16a34a" stroke-width="3" marker-end="url(#m40a16a34a)"/><rect x="492.0" y="50.0" width="115.0" height="50.0" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text class="at" x="549.5" y="75.0" font-size="14" fill="#1e3a8a">monomer</text><line class="hl" x1="607.0" y1="75.0" x2="650.0" y2="75.0"/><rect x="650.0" y="50.0" width="115.0" height="50.0" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/><text class="at" x="707.5" y="75.0" font-size="14" fill="#1e3a8a">monomer</text><line x1="478" y1="172" x2="400" y2="172" stroke="#ea580c" stroke-width="3" marker-end="url(#m40aea580c)"/><rect class="bg" x="167.5" y="64.8" width="25.1" height="20.4" rx="4"/><text class="at" x="180.0" y="75.0" font-size="17"><tspan fill="#dc2626">O</tspan><tspan fill="#6b7280">H</tspan></text><rect class="bg" x="220.7" y="64.8" width="14.5" height="20.4" rx="4"/><text class="at" x="228.0" y="75.0" font-size="17"><tspan fill="#6b7280">H</tspan></text><ellipse class="water" cx="204" cy="75" rx="50" ry="24"/><text class="lab" x="204.0" y="116.0" style="text-anchor:middle;fill:#2563eb;font-size:13px;">OH + H become H₂O</text><text class="lab" x="439.0" y="38.0" style="text-anchor:middle;fill:#15803d;font-size:13px;font-weight:700;">dehydration</text><text class="lab" x="439.0" y="55.0" style="text-anchor:middle;fill:#15803d;font-size:13px;font-weight:700;">synthesis</text><text class="lab" x="439.0" y="98.0" style="text-anchor:middle;font-size:12px;">enzyme helps</text><text class="lab" x="628.0" y="36.0" style="text-anchor:middle;fill:#15803d;font-size:13px;font-weight:700;">new covalent bond</text><rect class="bg" x="766.2" y="65.4" width="53.6" height="19.2" rx="4"/><text class="at" x="793.0" y="75.0" font-size="16"><tspan fill="#111827">+ </tspan><tspan fill="#6b7280">H₂</tspan><tspan fill="#dc2626">O</tspan></text><text class="lab" x="439.0" y="150.0" style="text-anchor:middle;fill:#c2410c;font-size:13px;font-weight:700;">hydrolysis</text><text class="lab" x="439.0" y="194.0" style="text-anchor:middle;font-size:12px;">H₂O goes IN, enzyme helps</text><text class="lab" x="204.0" y="172.0" style="text-anchor:middle;font-size:13px;">separate monomers</text><text class="lab" x="628.0" y="172.0" style="text-anchor:middle;font-size:13px;">joined (dimer → polymer)</text><text class="lab" x="410.0" y="232.0" style="text-anchor:middle;fill:#111;font-size:14px;font-weight:700;">Build = water OUT (anabolic).   Break = water IN (catabolic).</text></svg>