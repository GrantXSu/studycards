<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 696" width="900" height="696" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="696" fill="#ffffff"/><text x="450" y="26.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">Southern Pacific: Normal vs El Niño vs La Niña</text><rect x="10" y="50" width="880" height="190" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5" opacity="1"/><text x="24" y="74.0" font-size="17" fill="#4a148c" text-anchor="start" font-weight="bold">NORMAL</text><rect x="110" y="142" width="680" height="50" rx="0" fill="#90caf9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="30" y="110" width="80" height="82" rx="0" fill="#a1887f" stroke="none" stroke-width="1.5" opacity="1"/><text x="70" y="156.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Australia /</text><text x="70" y="169.4" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Indonesia</text><rect x="790" y="110" width="80" height="82" rx="0" fill="#a1887f" stroke="none" stroke-width="1.5" opacity="1"/><text x="830" y="156.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">South</text><text x="830" y="169.4" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">America</text><text x="830" y="182.8" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">(Peru)</text><ellipse cx="230" cy="167" rx="120" ry="22" fill="#ef5350" opacity=".85"/><line x1="700" y1="108" x2="380" y2="108" stroke="#ef6c00" stroke-width="3.5" marker-end="url(#ao)"/><text x="540" y="102.0" font-size="12" fill="#e65100" text-anchor="middle">trade winds</text><circle cx="92.4" cy="89.2" r="11.200000000000001" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="110.0" cy="81.2" r="14.4" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="127.6" cy="89.2" r="11.200000000000001" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="110.0" cy="92.4" r="11.200000000000001" fill="#b0bec5" stroke="none" stroke-width="1.5"/><line x1="97.2" y1="103.6" x2="93.2" y2="116.4" stroke="#1565c0" stroke-width="2"/><line x1="106.8" y1="103.6" x2="102.8" y2="116.4" stroke="#1565c0" stroke-width="2"/><line x1="116.4" y1="103.6" x2="112.4" y2="116.4" stroke="#1565c0" stroke-width="2"/><line x1="126.0" y1="103.6" x2="122.0" y2="116.4" stroke="#1565c0" stroke-width="2"/><line x1="760" y1="190" x2="760" y2="150" stroke="#1565c0" stroke-width="3.5" marker-end="url(#ab)"/><text x="785" y="134.0" font-size="11.5" fill="#0d47a1" text-anchor="end" font-weight="bold">upwelling</text><text x="24" y="210.0" font-size="12.5" fill="#333" text-anchor="start">Trade winds blow east to west and push warm water WEST (rain over Australia/Indonesia).</text><text x="24" y="225.2" font-size="12.5" fill="#333" text-anchor="start">Upwelling off Peru = cold, nutrient-rich water = lots of fish.</text><rect x="10" y="250" width="880" height="190" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5" opacity="1"/><text x="24" y="274.0" font-size="17" fill="#4a148c" text-anchor="start" font-weight="bold">EL NIÑO</text><rect x="110" y="342" width="680" height="50" rx="0" fill="#90caf9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="30" y="310" width="80" height="82" rx="0" fill="#a1887f" stroke="none" stroke-width="1.5" opacity="1"/><text x="70" y="356.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Australia /</text><text x="70" y="369.4" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Indonesia</text><rect x="790" y="310" width="80" height="82" rx="0" fill="#a1887f" stroke="none" stroke-width="1.5" opacity="1"/><text x="830" y="356.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">South</text><text x="830" y="369.4" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">America</text><text x="830" y="382.8" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">(Peru)</text><ellipse cx="560" cy="367" rx="220" ry="22" fill="#ef5350" opacity=".85"/><line x1="380" y1="308" x2="560" y2="308" stroke="#ef6c00" stroke-width="2" marker-end="url(#ao)" stroke-dasharray="6 4"/><text x="470" y="302.0" font-size="12" fill="#e65100" text-anchor="middle">weak / reversed trade winds</text><circle cx="672.4" cy="289.2" r="11.200000000000001" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="690.0" cy="281.2" r="14.4" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="707.6" cy="289.2" r="11.200000000000001" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="690.0" cy="292.4" r="11.200000000000001" fill="#b0bec5" stroke="none" stroke-width="1.5"/><line x1="677.2" y1="303.6" x2="673.2" y2="316.4" stroke="#1565c0" stroke-width="2"/><line x1="686.8" y1="303.6" x2="682.8" y2="316.4" stroke="#1565c0" stroke-width="2"/><line x1="696.4" y1="303.6" x2="692.4" y2="316.4" stroke="#1565c0" stroke-width="2"/><line x1="706.0" y1="303.6" x2="702.0" y2="316.4" stroke="#1565c0" stroke-width="2"/><text x="760" y="372.0" font-size="26" fill="#b71c1c" text-anchor="middle" font-weight="bold">X</text><text x="785" y="334.0" font-size="11.5" fill="#b71c1c" text-anchor="end" font-weight="bold">no upwelling</text><text x="24" y="410.0" font-size="12.5" fill="#333" text-anchor="start">Trade winds WEAKEN or reverse. Warm water sloshes EAST to Peru, upwelling stops, fish crash.</text><text x="24" y="425.2" font-size="12.5" fill="#333" text-anchor="start">Rain shifts east (Peru floods); Australia/Indonesia get drought.</text><rect x="10" y="450" width="880" height="190" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5" opacity="1"/><text x="24" y="474.0" font-size="17" fill="#4a148c" text-anchor="start" font-weight="bold">LA NIÑA</text><rect x="110" y="542" width="680" height="50" rx="0" fill="#90caf9" stroke="none" stroke-width="1.5" opacity="1"/><rect x="30" y="510" width="80" height="82" rx="0" fill="#a1887f" stroke="none" stroke-width="1.5" opacity="1"/><text x="70" y="556.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Australia /</text><text x="70" y="569.4" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Indonesia</text><rect x="790" y="510" width="80" height="82" rx="0" fill="#a1887f" stroke="none" stroke-width="1.5" opacity="1"/><text x="830" y="556.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">South</text><text x="830" y="569.4" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">America</text><text x="830" y="582.8" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">(Peru)</text><ellipse cx="190" cy="567" rx="90" ry="22" fill="#c62828" opacity=".9"/><line x1="720" y1="508" x2="330" y2="508" stroke="#ef6c00" stroke-width="6" marker-end="url(#ao)"/><text x="540" y="500.0" font-size="12" fill="#e65100" text-anchor="middle" font-weight="bold">STRONG trade winds</text><circle cx="78.0" cy="490.0" r="14.0" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="100.0" cy="480.0" r="18.0" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="122.0" cy="490.0" r="14.0" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="100.0" cy="494.0" r="14.0" fill="#b0bec5" stroke="none" stroke-width="1.5"/><line x1="84.0" y1="508.0" x2="79.0" y2="524.0" stroke="#1565c0" stroke-width="2"/><line x1="96.0" y1="508.0" x2="91.0" y2="524.0" stroke="#1565c0" stroke-width="2"/><line x1="108.0" y1="508.0" x2="103.0" y2="524.0" stroke="#1565c0" stroke-width="2"/><line x1="120.0" y1="508.0" x2="115.0" y2="524.0" stroke="#1565c0" stroke-width="2"/><line x1="760" y1="590" x2="760" y2="544" stroke="#1565c0" stroke-width="6" marker-end="url(#ab)"/><text x="785" y="534.0" font-size="11.5" fill="#0d47a1" text-anchor="end" font-weight="bold">strong upwelling</text><text x="24" y="610.0" font-size="12.5" fill="#333" text-anchor="start">Trade winds STRONGER than normal. Even more warm water piled west, stronger upwelling,</text><text x="24" y="625.2" font-size="12.5" fill="#333" text-anchor="start">colder water off Peru. Wetter Australia/Indonesia, drier Peru.</text><text x="450" y="664.0" font-size="12.5" fill="#333" text-anchor="middle">El Niño in the U.S. (class notes): warm, dry winters in the NORTHWEST; cool, wet winters in the SOUTHWEST.</text><text x="450" y="682.0" font-size="12.5" fill="#333" text-anchor="middle">Happens every 3-7 years, often starting near Christmas.</text></svg>