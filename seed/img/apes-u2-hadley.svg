<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="530" fill="#ffffff"/><text x="450" y="26.0" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">Hadley cell: why rainforests at the equator and deserts at 30°</text><rect x="0" y="300" width="900" height="18" rx="0" fill="#a1887f" stroke="none" stroke-width="1.5" opacity="1"/><rect x="380" y="294" width="140" height="6" rx="0" fill="#43a047" stroke="none" stroke-width="1.5" opacity="1"/><text x="450" y="338.0" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">Equator: hot, moist tropics = RAINFORESTS</text><rect x="20" y="294" width="140" height="6" rx="0" fill="#ffcc80" stroke="none" stroke-width="1.5" opacity="1"/><text x="90" y="338.0" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">30° S: hot, dry DESERT</text><rect x="740" y="294" width="140" height="6" rx="0" fill="#ffcc80" stroke="none" stroke-width="1.5" opacity="1"/><text x="810" y="338.0" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">30° N: hot, dry DESERT</text><circle cx="419.2" cy="125.6" r="19.599999999999998" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="450.0" cy="111.6" r="25.2" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="480.8" cy="125.6" r="19.599999999999998" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="450.0" cy="131.2" r="19.599999999999998" fill="#b0bec5" stroke="none" stroke-width="1.5"/><line x1="427.6" y1="150.8" x2="420.6" y2="173.2" stroke="#1565c0" stroke-width="2"/><line x1="444.4" y1="150.8" x2="437.4" y2="173.2" stroke="#1565c0" stroke-width="2"/><line x1="461.2" y1="150.8" x2="454.2" y2="173.2" stroke="#1565c0" stroke-width="2"/><line x1="478.0" y1="150.8" x2="471.0" y2="173.2" stroke="#1565c0" stroke-width="2"/><line x1="450" y1="290" x2="450" y2="175" stroke="#c62828" stroke-width="4" marker-end="url(#ar)"/><line x1="450" y1="95" x2="450" y2="60" stroke="#c62828" stroke-width="4" marker-end="url(#ar)"/><path d="M 450 60 L 120 60 L 100 260" stroke="#1565c0" stroke-width="3.5" fill="none" marker-end="url(#ab)"/><path d="M 450 60 L 780 60 L 800 260" stroke="#1565c0" stroke-width="3.5" fill="none" marker-end="url(#ab)"/><line x1="120" y1="280" x2="400" y2="280" stroke="#ef6c00" stroke-width="3" marker-end="url(#ao)"/><line x1="780" y1="280" x2="500" y2="280" stroke="#ef6c00" stroke-width="3" marker-end="url(#ao)"/><circle cx="470" cy="250" r="12" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><text x="470" y="255.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text><circle cx="500" cy="150" r="12" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><text x="500" y="155.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text><circle cx="470" cy="75" r="12" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><text x="470" y="80.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text><circle cx="620" cy="50" r="12" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><text x="620" y="55.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">4</text><circle cx="825" cy="200" r="12" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><text x="825" y="205.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="250" y="274.0" font-size="12" fill="#e65100" text-anchor="middle">trade winds return to equator (pick up moisture)</text><text x="20" y="372.0" font-size="13.5" fill="#222" text-anchor="start">1  Sun heats moist air at the equator (ITCZ): it becomes less dense and RISES.</text><text x="20" y="396.0" font-size="13.5" fill="#222" text-anchor="start">2  Rising air hits lower pressure, expands and cools (ADIABATIC COOLING). It reaches its</text><text x="20" y="412.5" font-size="13.5" fill="#222" text-anchor="start">    saturation point, so water vapor condenses into clouds and heavy RAIN.</text><text x="20" y="436.5" font-size="13.5" fill="#222" text-anchor="start">3  Condensation gives off LATENT HEAT, which warms the air so it rises even higher.</text><text x="20" y="460.5" font-size="13.5" fill="#222" text-anchor="start">4  At the top of the troposphere the now cold, DRY air is pushed north and south.</text><text x="20" y="484.5" font-size="13.5" fill="#222" text-anchor="start">5  It SINKS at about 30° N and S. Higher pressure compresses it (ADIABATIC HEATING): hot, dry,</text><text x="20" y="501.0" font-size="13.5" fill="#222" text-anchor="start">    high pressure, clear skies = DESERTS. It flows back to the equator along the surface.</text></svg>