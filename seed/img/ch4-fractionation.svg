<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" class="dia" role="img" aria-label="Cell fractionation by centrifugation"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
