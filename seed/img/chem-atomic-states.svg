<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" class="dia" role="img" aria-label="Solid liquid gas particles"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
