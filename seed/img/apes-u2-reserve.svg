<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="450" y="26.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">Biosphere reserve design (UNESCO)</text><circle cx="300" cy="240" r="190" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/><circle cx="300" cy="240" r="125" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/><circle cx="300" cy="240" r="62" fill="#1b5e20" stroke="none" stroke-width="1.5"/><text x="300" y="236.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">CORE</text><text x="300" y="254.0" font-size="11" fill="#fff" text-anchor="middle">minimal impact</text><text x="300" y="150.0" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">BUFFER ZONE</text><text x="300" y="82.0" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">TRANSITION AREA</text><text x="520" y="110.0" font-size="14" fill="#e65100" text-anchor="start" font-weight="bold">TRANSITION AREA (outer)</text><text x="520" y="128.0" font-size="12.5" fill="#222" text-anchor="start">human settlements, sustainable</text><text x="520" y="143.2" font-size="12.5" fill="#222" text-anchor="start">logging + farming, residents</text><text x="520" y="200.0" font-size="14" fill="#1b5e20" text-anchor="start" font-weight="bold">BUFFER ZONE (middle)</text><text x="520" y="218.0" font-size="12.5" fill="#222" text-anchor="start">modest use: recreation, tourism,</text><text x="520" y="233.2" font-size="12.5" fill="#222" text-anchor="start">environmental education, research</text><text x="520" y="290.0" font-size="14" fill="#1b5e20" text-anchor="start" font-weight="bold">CORE (center)</text><text x="520" y="308.0" font-size="12.5" fill="#222" text-anchor="start">protects biodiversity; observation</text><text x="520" y="323.2" font-size="12.5" fill="#222" text-anchor="start">only, minimal human impact</text><text x="450" y="455.0" font-size="12.5" fill="#333" text-anchor="middle">Examples: Big Bend National Park (TX) is the core of its reserve; Galápagos (some islands off-limits, others allow trails).</text></svg>