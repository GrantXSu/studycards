<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" class="dia" role="img" aria-label="Average atomic mass worked example"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dia .ring{stroke:#1f2937;stroke-width:2;fill:none;stroke-linejoin:round}
.dia .ptr{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:3 3}
.dia .hbond{stroke:#2563eb;stroke-width:1.6;stroke-dasharray:3 3}
.dia .hbond2{stroke:#2563eb;stroke-width:2;stroke-dasharray:4 3}
.dia .ss{stroke:#b45309;stroke-width:2.5;stroke-dasharray:4 3}
.dia .hexa{stroke:#374151;stroke-width:1.2}
.dia .chain{stroke:#374151;stroke-width:2;fill:none}
.dia .pchain{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .backbone{stroke:#94a3b8;stroke-width:5}
.dia .dnastr{stroke:#2563eb;stroke-width:3;fill:none}
.dia .rnastr{stroke:#7c3aed;stroke-width:3;fill:none}
.dia .bg{fill:#fff}
.dia .water{fill:rgba(59,130,246,.08);stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="420" fill="#ffffff"/><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="1"/><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="1"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><text x="500.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Average atomic mass = weighted average of the isotopes</text><rect x="60" y="62" width="880" height="44" rx="8" fill="#e0e7ff"/><text x="90.0" y="91.0" font-size="16" font-weight="800" text-anchor="start" fill="#3730a3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Isotope</text><text x="250.0" y="91.0" font-size="16" font-weight="800" text-anchor="start" fill="#3730a3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Mass (amu)</text><text x="430.0" y="91.0" font-size="16" font-weight="800" text-anchor="start" fill="#3730a3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">× % abundance (as decimal)</text><text x="740.0" y="91.0" font-size="16" font-weight="800" text-anchor="start" fill="#3730a3" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">= contribution</text><rect x="60" y="120" width="880" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="90.0" y="150.0" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Cl-35</text><text x="250.0" y="150.0" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">34.97</text><text x="430.0" y="150.0" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">× 0.7577</text><text x="740.0" y="150.0" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">= 26.50 amu</text><rect x="60" y="170" width="880" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="90.0" y="200.0" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Cl-37</text><text x="250.0" y="200.0" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">36.97</text><text x="430.0" y="200.0" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">× 0.2423</text><text x="740.0" y="200.0" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">=   8.96 amu</text><line x1="720" y1="232" x2="930" y2="232" stroke="#0f172a" stroke-width="2"/><text x="930.0" y="264.0" font-size="20" font-weight="800" text-anchor="end" fill="#b91c1c" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">ADD → average atomic mass = 35.46 amu</text><text x="500.0" y="318.0" font-size="16" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Steps: 1) change each % to a decimal (÷ 100)   2) multiply mass × decimal   3) ADD the contributions</text><text x="500.0" y="344.0" font-size="16" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Check: the answer is between the isotope masses and closest to the MOST abundant one.</text><text x="500.0" y="370.0" font-size="16" font-weight="600" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">That’s why periodic table masses are decimals, not whole numbers.</text></svg>