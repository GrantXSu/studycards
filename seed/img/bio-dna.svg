<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" class="dia" viewBox="0 0 560 470" role="img" aria-label="DNA double helix drawn as a ladder"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
