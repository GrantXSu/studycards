<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" class="dia" role="img" aria-label="Lab safety equipment"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dia .ring{stroke:#1f2937;stroke-width:2;fill:none;stroke-linejoin:round}
.dia .ptr{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:3 3}
.dia .hbond{stroke:#2563eb;stroke-width:1.6;stroke-dasharray:3 3}
.dia .hbond2{stroke:#2563eb;stroke-width:2;stroke-dasharray:4 3}
.dia .ss{stroke:#b45309;stroke-width:2.5;stroke-dasharray:4 3}
.dia .hexa{stroke:#374151;stroke-width:1.2}
.dia .chain{stroke:#374151;stroke-width:2;fill:none}
.dia .pchain{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .backbone{stroke:#94a3b8;stroke-width:5}
.dia .dnastr{stroke:#2563eb;stroke-width:3;fill:none}
.dia .rnastr{stroke:#7c3aed;stroke-width:3;fill:none}
.dia .bg{fill:#fff}
.dia .water{fill:rgba(59,130,246,.08);stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="470" fill="#ffffff"/><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="1"/><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="1"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><text x="500.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Lab safety: equipment &amp; what it’s for</text><rect x="30" y="70" width="460" height="76" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><rect x="30" y="70" width="12" height="76" rx="6" fill="#2563eb"/><text x="56.0" y="100.0" font-size="18" font-weight="800" text-anchor="start" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Safety goggles</text><text x="56.0" y="126.0" font-size="14" font-weight="600" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">wear whenever chemicals, glass or heat are out</text><rect x="510" y="70" width="460" height="76" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2.5"/><rect x="510" y="70" width="12" height="76" rx="6" fill="#0891b2"/><text x="536.0" y="100.0" font-size="18" font-weight="800" text-anchor="start" fill="#0891b2" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Eyewash station</text><text x="536.0" y="126.0" font-size="14" font-weight="600" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chemical in the eye → flush ~15 min, eyelids open</text><rect x="30" y="158" width="460" height="76" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2.5"/><rect x="30" y="158" width="12" height="76" rx="6" fill="#0d9488"/><text x="56.0" y="188.0" font-size="18" font-weight="800" text-anchor="start" fill="#0d9488" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Safety shower</text><text x="56.0" y="214.0" font-size="14" font-weight="600" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">big spill on body/clothes → pull, rinse, remove clothing</text><rect x="510" y="158" width="460" height="76" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><rect x="510" y="158" width="12" height="76" rx="6" fill="#dc2626"/><text x="536.0" y="188.0" font-size="18" font-weight="800" text-anchor="start" fill="#dc2626" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Fire extinguisher</text><text x="536.0" y="214.0" font-size="14" font-weight="600" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">small fires (P-A-S-S: Pull, Aim, Squeeze, Sweep)</text><rect x="30" y="246" width="460" height="76" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2.5"/><rect x="30" y="246" width="12" height="76" rx="6" fill="#ea580c"/><text x="56.0" y="276.0" font-size="18" font-weight="800" text-anchor="start" fill="#ea580c" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Fire blanket</text><text x="56.0" y="302.0" font-size="14" font-weight="600" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">smother a fire on a person (stop, drop, roll)</text><rect x="510" y="246" width="460" height="76" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/><rect x="510" y="246" width="12" height="76" rx="6" fill="#7c3aed"/><text x="536.0" y="276.0" font-size="18" font-weight="800" text-anchor="start" fill="#7c3aed" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Fume hood</text><text x="536.0" y="302.0" font-size="14" font-weight="600" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">work with toxic or smelly vapors</text><rect x="30" y="334" width="460" height="76" rx="12" fill="#fff" stroke="#db2777" stroke-width="2.5"/><rect x="30" y="334" width="12" height="76" rx="6" fill="#db2777"/><text x="56.0" y="364.0" font-size="18" font-weight="800" text-anchor="start" fill="#db2777" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">First-aid kit</text><text x="56.0" y="390.0" font-size="14" font-weight="600" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">minor cuts and burns — ALWAYS tell the teacher</text><rect x="510" y="334" width="460" height="76" rx="12" fill="#fff" stroke="#475569" stroke-width="2.5"/><rect x="510" y="334" width="12" height="76" rx="6" fill="#475569"/><text x="536.0" y="364.0" font-size="18" font-weight="800" text-anchor="start" fill="#475569" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Broken-glass box</text><text x="536.0" y="390.0" font-size="14" font-weight="600" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">broken glass never goes in the regular trash</text><text x="500.0" y="450.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Know where each one is in YOUR lab, plus the exits. Report every accident, spill or injury to the teacher right away.</text></svg>