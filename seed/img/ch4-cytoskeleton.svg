f" stroke-width="4" paint-order="stroke" stroke-linejoin="round">  &amp; other organelles</text><text x="708.0" y="374.0" font-size="14.5" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• form nuclear lamina</text><text x="708.0" y="395.0" font-size="14.5" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• most permanent</text><text x="708.0" y="416.0" font-size="14.5" font-weight="500" text-anchor="start" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">• NOT used for movement</text></svg>