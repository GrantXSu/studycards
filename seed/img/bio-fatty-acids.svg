<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" class="dia" viewBox="0 0 760 310" role="img" aria-label="Saturated fatty acid versus unsaturated fatty acid"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dia .ring{stroke:#1f2937;stroke-width:2;fill:none;stroke-linejoin:round}
.dia .ptr{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:3 3}
.dia .hbond{stroke:#2563eb;stroke-width:1.6;stroke-dasharray:3 3}
.dia .hbond2{stroke:#2563eb;stroke-width:2;stroke-dasharray:4 3}
.dia .ss{stroke:#b45309;stroke-width:2.5;stroke-dasharray:4 3}
.dia .hexa{stroke:#374151;stroke-width:1.2}
.dia .chain{stroke:#374151;stroke-width:2;fill:none}
.dia .pchain{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .backbone{stroke:#94a3b8;stroke-width:5}
.dia .dnastr{stroke:#2563eb;stroke-width:3;fill:none}
.dia .rnastr{stroke:#7c3aed;stroke-width:3;fill:none}
.dia .bg{fill:#fff}
.dia .water{fill:rgba(59,130,246,.08);stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><defs></defs><line class="b" x1="40.0" y1="80.0" x2="85.0" y2="80.0"/><line class="b" x1="88.2" y1="80.0" x2="88.2" y2="50.0"/><line class="b" x1="81.8" y1="80.0" x2="81.8" y2="50.0"/><polyline class="tail" points="85.0,80.0 107.0,67.0 129.0,80.0 151.0,67.0 173.0,80.0 195.0,67.0 217.0,80.0 239.0,67.0 261.0,80.0 283.0,67.0 305.0,80.0 327.0,67.0 349.0,80.0 371.0,67.0 393.0,80.0 415.0,67.0 437.0,80.0"/><line class="b" x1="40.0" y1="195.0" x2="85.0" y2="195.0"/><line class="b" x1="88.2" y1="195.0" x2="88.2" y2="165.0"/><line class="b" x1="81.8" y1="195.0" x2="81.8" y2="165.0"/><polyline class="tail" points="85.0,195.0 107.0,182.0 129.0,195.0 151.0,182.0 173.0,195.0 195.0,182.0 217.0,195.0 239.0,182.0 261.0,195.0"/><line class="tail" x1="260.8" y1="198.0" x2="286.2" y2="200.0"/><line class="tail" x1="261.2" y1="192.0" x2="286.7" y2="194.0"/><polyline class="tail" points="286.5,197.0 297.0,220.2 322.5,222.2 333.1,245.5 358.6,247.4 369.1,270.7 394.6,272.7"/><line class="ptr" x1="290.5" y1="191.0" x2="330.0" y2="150.0"/><text class="lab" x="20.0" y="22.0" style="text-anchor:start;font-size:14px;font-weight:700;">SATURATED</text><rect class="bg" x="27.5" y="69.8" width="25.1" height="20.4" rx="4"/><text class="at" x="40.0" y="80.0" font-size="17"><tspan fill="#6b7280">H</tspan><tspan fill="#dc2626">O</tspan></text><rect class="bg" x="77.7" y="32.8" width="14.5" height="20.4" rx="4"/><text class="at" x="85.0" y="43.0" font-size="17"><tspan fill="#dc2626">O</tspan></text><text class="lab" x="470.0" y="70.0" style="text-anchor:start;font-size:13px;">no C=C double bonds, full of H</text><text class="lab" x="470.0" y="88.0" style="text-anchor:start;font-size:13px;font-weight:700;">straight → packs tight → SOLID (butter)</text><text class="lab" x="20.0" y="140.0" style="text-anchor:start;font-size:14px;font-weight:700;">UNSATURATED</text><rect class="bg" x="27.5" y="184.8" width="25.1" height="20.4" rx="4"/><text class="at" x="40.0" y="195.0" font-size="17"><tspan fill="#6b7280">H</tspan><tspan fill="#dc2626">O</tspan></text><rect class="bg" x="77.7" y="147.8" width="14.5" height="20.4" rx="4"/><text class="at" x="85.0" y="158.0" font-size="17"><tspan fill="#dc2626">O</tspan></text><text class="lab" x="334.0" y="148.0" style="text-anchor:start;fill:#dc2626;font-size:13px;font-weight:700;">cis C=C double bond → kink</text><text class="lab" x="430.0" y="230.0" style="text-anchor:start;font-size:13px;font-weight:700;">kinks stop packing → LIQUID oil</text><text class="lab" x="430.0" y="248.0" style="text-anchor:start;font-size:13px;">(olive oil, fish oil)</text><text class="lab" x="380.0" y="296.0" style="text-anchor:middle;font-size:12px;">Skeletal drawing: every corner is a carbon; the H’s on carbons are not drawn.</text></svg>