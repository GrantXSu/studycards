<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" width="900" height="435" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="435" fill="#ffffff"/><text x="450" y="26.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">Lake and pond zones</text><path d="M 40 120 L 860 120 L 760 170 C 650 380, 260 380, 150 170 Z" stroke="none" stroke-width="0" fill="#bbdefb"/><path d="M 270 230 C 360 300, 550 300, 640 230 L 610 290 C 540 345, 370 345, 300 290 Z" stroke="none" stroke-width="0" fill="#1a237e"/><path d="M 40 120 L 150 170 C 260 380, 650 380, 760 170 L 860 120" stroke="#6d4c41" stroke-width="9" fill="none"/><line x1="40" y1="120" x2="860" y2="120" stroke="#1e88e5" stroke-width="2"/><line x1="200" y1="228" x2="700" y2="228" stroke="#f9a825" stroke-width="2" stroke-dasharray="8 5"/><text x="620" y="222.0" font-size="12" fill="#f57f17" text-anchor="middle" font-weight="bold">sunlight limit</text><line x1="60" y1="150" x2="60" y2="80" stroke="#558b2f" stroke-width="3"/><ellipse cx="60" cy="78" rx="4" ry="11" fill="#795548"/><line x1="85" y1="150" x2="85" y2="80" stroke="#558b2f" stroke-width="3"/><ellipse cx="85" cy="78" rx="4" ry="11" fill="#795548"/><line x1="110" y1="150" x2="110" y2="80" stroke="#558b2f" stroke-width="3"/><ellipse cx="110" cy="78" rx="4" ry="11" fill="#795548"/><line x1="790" y1="150" x2="790" y2="80" stroke="#558b2f" stroke-width="3"/><ellipse cx="790" cy="78" rx="4" ry="11" fill="#795548"/><line x1="815" y1="150" x2="815" y2="80" stroke="#558b2f" stroke-width="3"/><ellipse cx="815" cy="78" rx="4" ry="11" fill="#795548"/><line x1="840" y1="150" x2="840" y2="80" stroke="#558b2f" stroke-width="3"/><ellipse cx="840" cy="78" rx="4" ry="11" fill="#795548"/><text x="90" y="205.0" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">LITTORAL zone</text><text x="90" y="223.0" font-size="11.5" fill="#1b5e20" text-anchor="middle">shallow, near shore;</text><text x="90" y="237.0" font-size="11.5" fill="#1b5e20" text-anchor="middle">rooted/emergent plants</text><text x="90" y="251.1" font-size="11.5" fill="#1b5e20" text-anchor="middle">(cattails); most PS</text><text x="450" y="165.0" font-size="15" fill="#0d47a1" text-anchor="middle" font-weight="bold">LIMNETIC zone</text><text x="450" y="184.0" font-size="12" fill="#0d47a1" text-anchor="middle">open, sunlit water; NO rooted plants; phytoplankton are the only producers</text><text x="455" y="290.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">PROFUNDAL zone</text><text x="455" y="308.0" font-size="11.5" fill="#fff" text-anchor="middle">too dark for PS; decomposers use up O2</text><text x="450" y="395.0" font-size="13" fill="#4e342e" text-anchor="middle" font-weight="bold">BENTHIC zone = the muddy bottom under all the other zones (sediments, decomposers, insect larvae)</text><text x="450" y="420.0" font-size="12.5" fill="#333" text-anchor="middle">Oligotrophic = few nutrients, clear, high O2   |   Mesotrophic = medium   |   Eutrophic = many nutrients, algae, low O2</text></svg>