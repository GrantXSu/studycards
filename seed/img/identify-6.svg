<svg xmlns="http://www.w3.org/2000/svg" width="220" height="200" class="dia" viewBox="0 0 220 200" role="img" aria-label="Mystery molecule"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
