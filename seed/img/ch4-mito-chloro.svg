<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470" class="dia" role="img" aria-label="Mitochondrion and chloroplast structure"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
