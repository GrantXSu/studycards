 stroke-width="1.3"/><text x="820.0" y="300.0" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">own DNA</text><line x1="900" y1="240" x2="950" y2="302" stroke="#334155" stroke-width="1.4"/><circle cx="900" cy="240" r="3.2" fill="#334155" stroke="#fff" stroke-width="1.3"/><text x="950.0" y="318.0" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">stroma (fluid)</text><text x="250.0" y="358.0" font-size="14" font-weight="500" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">cellular respiration → makes most ATP</text><text x="250.0" y="378.0" font-size="14" font-weight="500" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">in plant AND animal cells</text><text x="250.0" y="398.0" font-size="14" font-weight="500" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">respiration enzymes sit on the cristae</text><text x="800.0" y="358.0" font-size="14" font-weight="500" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">photosynthesis: light energy → sugar</text><text x="800.0" y="378.0" font-size="14" font-weight="500" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">plants &amp; algae only</text><text x="800.0" y="398.0" font-size="14" font-weight="500" text-anchor="middle" fill="#334155" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chlorophyll is in the thylakoid membranes</text><rect x="60" y="428" width="940" height="32" rx="8" fill="#f5f3ff"/><text x="530.0" y="450.0" font-size="14" font-weight="700" text-anchor="middle" fill="#6d28d9" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">BOTH: double membrane · own DNA + ribosomes · ATP synthase makes ATP · divide on their own → endosymbiosis</text></svg>