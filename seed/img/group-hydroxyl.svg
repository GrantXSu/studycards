<svg xmlns="http://www.w3.org/2000/svg" width="150" height="100" class="dia" viewBox="0 0 150 100" role="img" aria-label="Hydroxyl"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
