<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="490" fill="#ffffff"/><text x="450" y="26.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">Rain shadow (orographic precipitation)</text><rect x="0" y="330" width="230" height="60" rx="0" fill="#64b5f6" stroke="none" stroke-width="1.5" opacity="1"/><text x="115" y="365.0" font-size="14" fill="#0d47a1" text-anchor="middle" font-weight="bold">Pacific Ocean</text><path d="M 230 330 L 450 110 L 670 330 Z" stroke="#6d4c41" stroke-width="2" fill="#a1887f"/><rect x="670" y="330" width="230" height="60" rx="0" fill="#ffe0b2" stroke="none" stroke-width="1.5" opacity="1"/><rect x="230" y="330" width="440" height="60" rx="0" fill="#a5d6a7" stroke="none" stroke-width="1.5" opacity="1"/><path d="M 260 330 L 450 140 L 450 330 Z" stroke="none" stroke-width="0" fill="#66bb6a"/><line x1="40" y1="300" x2="210" y2="300" stroke="#1565c0" stroke-width="3.5" marker-end="url(#ab)"/><text x="40" y="290.0" font-size="13" fill="#0d47a1" text-anchor="start">moist ocean air (prevailing winds)</text><line x1="250" y1="300" x2="400" y2="150" stroke="#1565c0" stroke-width="3.5" marker-end="url(#ab)"/><circle cx="323.6" cy="164.8" r="16.8" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="350.0" cy="152.8" r="21.599999999999998" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="376.4" cy="164.8" r="16.8" fill="#b0bec5" stroke="none" stroke-width="1.5"/><circle cx="350.0" cy="169.6" r="16.8" fill="#b0bec5" stroke="none" stroke-width="1.5"/><line x1="330.8" y1="186.4" x2="324.8" y2="205.6" stroke="#1565c0" stroke-width="2"/><line x1="345.2" y1="186.4" x2="339.2" y2="205.6" stroke="#1565c0" stroke-width="2"/><line x1="359.6" y1="186.4" x2="353.6" y2="205.6" stroke="#1565c0" stroke-width="2"/><line x1="374.0" y1="186.4" x2="368.0" y2="205.6" stroke="#1565c0" stroke-width="2"/><line x1="470" y1="105" x2="640" y2="280" stroke="#c62828" stroke-width="3.5" marker-end="url(#ar)"/><line x1="650" y1="300" x2="860" y2="300" stroke="#c62828" stroke-width="3.5" marker-end="url(#ar)"/><text x="250" y="420.0" font-size="13.5" fill="#1b5e20" text-anchor="start" font-weight="bold">WINDWARD side: air rises + cools</text><text x="250" y="436.5" font-size="13.5" fill="#1b5e20" text-anchor="start" font-weight="bold">(adiabatic cooling), condenses,</text><text x="250" y="452.9" font-size="13.5" fill="#1b5e20" text-anchor="start" font-weight="bold">lots of rain = wet forest</text><text x="640" y="420.0" font-size="13.5" fill="#bf360c" text-anchor="start" font-weight="bold">LEEWARD side: dry air sinks + warms</text><text x="640" y="436.5" font-size="13.5" fill="#bf360c" text-anchor="start" font-weight="bold">(adiabatic heating) = RAIN SHADOW,</text><text x="640" y="452.9" font-size="13.5" fill="#bf360c" text-anchor="start" font-weight="bold">dry grassland / desert</text><text x="450" y="98.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Cascades</text><text x="385" y="288.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Seattle</text><text x="385" y="303.9" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">37 in/yr</text><text x="760" y="250.0" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">Moses Lake</text><text x="760" y="265.9" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">7.7 in/yr</text></svg>