,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">10 nm</text><line x1="484" y1="202" x2="484" y2="218" stroke="#0f172a" stroke-width="2"/><text x="484.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">100 nm</text><line x1="562" y1="202" x2="562" y2="218" stroke="#0f172a" stroke-width="2"/><text x="562.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1 µm</text><line x1="640" y1="202" x2="640" y2="218" stroke="#0f172a" stroke-width="2"/><text x="640.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">10 µm</text><line x1="718" y1="202" x2="718" y2="218" stroke="#0f172a" stroke-width="2"/><text x="718.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">100 µm</text><line x1="796" y1="202" x2="796" y2="218" stroke="#0f172a" stroke-width="2"/><text x="796.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1 mm</text><line x1="874" y1="202" x2="874" y2="218" stroke="#0f172a" stroke-width="2"/><text x="874.0" y="238.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order=