"middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">plant/animal cell</text><line x1="718.0" y1="158" x2="718.0" y2="205" stroke="#64748b" stroke-width="1.3"/><circle cx="718.0" cy="206" r="4.5" fill="#f97316"/><text x="718.0" y="154.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">human egg</text><line x1="819.5" y1="184" x2="819.5" y2="205" stroke="#64748b" stroke-width="1.3"/><circle cx="819.5" cy="206" r="4.5" fill="#f97316"/><text x="819.5" y="180.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">frog egg</text><rect x="562.0" y="60" width="156.0" height="22" rx="5" fill="#fef08a"/><text x="640.0" y="76.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">most cells: 1–100 µm</text><rect x="351.5" y="272" width="366.5" height="26" rx="6" fill="#7c3aed"/><text x="359.5" y="290.0" font-size="14" font-weight="700" text-anchor="start" fill="#fff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Electron microscope (EM)</text><line x1="351.5" y1="268" x2="351.5" y2="302" stroke="#7c3aed" stroke-width="3"/><text x="343.5" y="290.0" font-size="12.5" font-weight="600" text-anchor="end" fill="#7c3aed" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">best ≈ 2 nm, dead cells only</text><rect x="419.7" y="318" width="376.3" height="26" rx="6" fill="#0ea5e9"/><text x="427.7" y="336.0" font-size="14" font-weight="700" text-anchor="start" fill="#fff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Super-resolution light</text><line x1="419.7" y1="314" x2="419.7" y2="348" stroke="#0ea5e9" stroke-width="3"/><text x="411.7" y="336.0" font-size="12.5" font-weight="600" text-anchor="end" fill="#0ea5e9" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">≈ 10–20 nm</text><rect x="507.5" y="364" width="366.5" height="26" rx="6" fill="#2563eb"/><text x="515.5" y="382.0" font-size="14" font-weight="700" text-anchor="start" fill="#fff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Light microscope (LM)</text><line x1="507.5" y1="360" x2="507.5" y2="394" stroke="#2563eb" stroke-width="3"/><text x="499.5" y="382.0" font-size="12.5" font-weight="600" text-anchor="end" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">limit ≈ 0.2 µm = 200 nm, living cells OK</text><rect x="718.0" y="410" width="312.0" height="26" rx="6" fill="#0d9488"/><text x="726.0" y="428.0" font-size="14" font-weight="700" text-anchor="start" fill="#fff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Unaided eye</text><line x1="718.0" y1="406" x2="718.0" y2="440" stroke="#0d9488" stroke-width="3"/><text x="710.0" y="428.0" font-size="12.5" font-weight="600" text-anchor="end" fill="#0d9488" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">limit ≈ 0.1 mm = 100 µm</text></svg>