<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="490" fill="#ffffff"/><text x="450" y="26.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">Ocean zones</text><path d="M 0 110 L 900 110 L 900 450 L 330 450 C 280 300, 220 200, 120 150 L 40 120 Z" stroke="none" stroke-width="0" fill="#90caf9"/><path d="M 0 110 L 900 110 L 900 230 L 230 230 C 200 190, 160 165, 120 150 L 40 120 Z" stroke="none" stroke-width="0" fill="#bbdefb"/><path d="M 0 95 L 40 120 L 120 150 C 220 200, 280 300, 330 450 L 900 450" stroke="#6d4c41" stroke-width="8" fill="none"/><line x1="0" y1="100" x2="150" y2="100" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="156" y="104.0" font-size="11" fill="#1565c0" text-anchor="start">high tide</text><line x1="0" y1="125" x2="150" y2="125" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="156" y="140.0" font-size="11" fill="#1565c0" text-anchor="start">low tide</text><text x="8" y="48.0" font-size="12" fill="#4a148c" text-anchor="start" font-weight="bold">INTERTIDAL zone (between high + low tide;</text><text x="8" y="62.6" font-size="12" fill="#4a148c" text-anchor="start" font-weight="bold">barnacles, sea stars, mussels)</text><line x1="230" y1="230" x2="900" y2="230" stroke="#f9a825" stroke-width="2" stroke-dasharray="8 5"/><text x="600" y="160.0" font-size="13" fill="#0d47a1" text-anchor="middle" font-weight="bold">PHOTIC zone (0 to ~200 m): enough light for photosynthesis</text><text x="600" y="178.0" font-size="12" fill="#0d47a1" text-anchor="middle">phytoplankton (producers) and zooplankton drift = base of the food web</text><text x="600" y="300.0" font-size="13" fill="#0d47a1" text-anchor="middle" font-weight="bold">APHOTIC zone: no light, no photosynthesis</text><text x="600" y="318.0" font-size="12" fill="#0d47a1" text-anchor="middle">squid, anglerfish, bioluminescent animals; food = organic matter raining down</text><text x="600" y="128.0" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">&lt;- PELAGIC = the open water column (organisms swim or drift, not anchored) -&gt;</text><text x="510" y="440.0" font-size="13" fill="#4e342e" text-anchor="middle" font-weight="bold">BENTHIC zone = the ocean floor (shallow or deep)</text><polygon points="800,450 815,420 830,450" fill="#5d4037"/><path d="M 815 418 C 810 400, 825 390, 818 372" stroke="#9e9e9e" stroke-width="4" fill="none"/><text x="795" y="396.0" font-size="11" fill="#4e342e" text-anchor="end">hydrothermal vent:</text><text x="795" y="409.4" font-size="11" fill="#4e342e" text-anchor="end">CHEMOSYNTHESIS</text><text x="795" y="422.8" font-size="11" fill="#4e342e" text-anchor="end">(H2S, CH4)</text><text x="450" y="478.0" font-size="13" fill="#333" text-anchor="middle">Pelagic productivity depends on LIGHT (photic depth) + NUTRIENTS (N and P from upwelling and river mouths).</text></svg>