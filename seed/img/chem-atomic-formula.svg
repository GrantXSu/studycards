<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" class="dia" role="img" aria-label="Counting atoms in Al2(SO4)3"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
.dia .thick{stroke:#1f2937;stroke-width:5;stroke-linecap:round}
.dia .hl{stroke:#16a34a;stroke-width:5;stroke-linecap:round}
.dia .tail{stroke:#374151;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dia .ring{stroke:#1f2937;stroke-width:2;fill:none;stroke-linejoin:round}
.dia .ptr{stroke:#9ca3af;stroke-width:1.3;stroke-dasharray:3 3}
.dia .hbond{stroke:#2563eb;stroke-width:1.6;stroke-dasharray:3 3}
.dia .hbond2{stroke:#2563eb;stroke-width:2;stroke-dasharray:4 3}
.dia .ss{stroke:#b45309;stroke-width:2.5;stroke-dasharray:4 3}
.dia .hexa{stroke:#374151;stroke-width:1.2}
.dia .chain{stroke:#374151;stroke-width:2;fill:none}
.dia .pchain{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .backbone{stroke:#94a3b8;stroke-width:5}
.dia .dnastr{stroke:#2563eb;stroke-width:3;fill:none}
.dia .rnastr{stroke:#7c3aed;stroke-width:3;fill:none}
.dia .bg{fill:#fff}
.dia .water{fill:rgba(59,130,246,.08);stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.dia .at{text-anchor:middle;dominant-baseline:central;font-weight:700}
.dia .lab{dominant-baseline:central;font-size:13px;fill:#374151}
.dia .num{dominant-baseline:central;font-size:12px;fill:#2563eb;font-weight:800;text-anchor:middle}
.dia text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="1000" height="380" fill="#ffffff"/><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="1"/><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="1"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><text x="500.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Counting atoms in a formula</text><text x="500.0" y="118.0" font-size="64" font-weight="800" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Al₂(SO₄)₃</text><line x1="380" y1="138" x2="330" y2="190" stroke="#334155" stroke-width="2.2" marker-end="url(#ak)"/><line x1="560" y1="138" x2="600" y2="190" stroke="#334155" stroke-width="2.2" marker-end="url(#ak)"/><text x="300.0" y="215.0" font-size="17" font-weight="700" text-anchor="middle" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Al: subscript 2</text><text x="300.0" y="239.0" font-size="17" font-weight="700" text-anchor="middle" fill="#2563eb" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">→ 2 aluminum</text><text x="660.0" y="215.0" font-size="17" font-weight="700" text-anchor="middle" fill="#16a34a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">(SO₄)₃ = 3 copies of SO₄</text><text x="660.0" y="239.0" font-size="17" font-weight="700" text-anchor="middle" fill="#16a34a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">S: 1 × 3 = 3 sulfur</text><text x="660.0" y="263.0" font-size="17" font-weight="700" text-anchor="middle" fill="#16a34a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">O: 4 × 3 = 12 oxygen</text><rect x="60" y="305" width="880" height="58" rx="10" fill="#f1f5f9"/><text x="500.0" y="330.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Subscript = number of atoms of the element right before it (no subscript = 1).</text><text x="500.0" y="352.0" font-size="15.5" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">A subscript after ( ) multiplies EVERYTHING inside.  Total here: 2 + 3 + 12 = 17 atoms.</text></svg>