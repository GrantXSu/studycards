<svg xmlns="http://www.w3.org/2000/svg" width="300" height="230" class="dia" viewBox="0 0 300 230" role="img" aria-label="Mystery molecule"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
