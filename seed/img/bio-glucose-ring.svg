<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" class="dia" viewBox="0 0 420 300" role="img" aria-label="Alpha glucose ring with numbered carbons"><style>.dia .b{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round}
