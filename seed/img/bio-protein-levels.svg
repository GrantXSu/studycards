lass="at" x="73.0" y="120.0" font-size="8" fill="#111">Leu</text><circle cx="97.0" cy="120.0" r="11" fill="#bbf7d0" stroke="#374151" stroke-width="1.5"/><text class="at" x="97.0" y="120.0" font-size="8" fill="#111">Thr</text><circle cx="121.0" cy="120.0" r="11" fill="#fde68a" stroke="#374151" stroke-width="1.5"/><text class="at" x="121.0" y="120.0" font-size="8" fill="#111">Pro</text><circle cx="145.0" cy="120.0" r="11" fill="#fecaca" stroke="#374151" stroke-width="1.5"/><text class="at" x="145.0" y="120.0" font-size="8" fill="#111">Glu</text><circle cx="169.0" cy="120.0" r="11" fill="#fecaca" stroke="#374151" stroke-width="1.5"/><text class="at" x="169.0" y="120.0" font-size="8" fill="#111">Glu</text><text class="lab" x="95.0" y="205.0" style="text-anchor:middle;font-size:12px;font-weight:700;">amino acid ORDER</text><text class="lab" x="95.0" y="221.0" style="text-anchor:middle;font-size:12px;">held by peptide bonds</text><text class="lab" x="95.0" y="237.0" style="text-anchor:middle;font-size:12px;">set by the gene</text><text class="lab" x="290.0" y="28.0" style="text-anchor:middle;font-size:14px;font-weight:700;">2 · Secondary</text><text class="lab" x="290.0" y="118.0" style="text-anchor:middle;font-size:12px;font-weight:700;">α helix</text><text class="lab" x="290.0" y="212.0" style="text-anchor:middle;font-size:12px;font-weight:700;">β pleated sheet</text><text class="lab" x="290.0" y="230.0" style="text-anchor:middle;font-size:12px;">H-bonds between BACKBONE</text><text class="lab" x="290.0" y="246.0" style="text-anchor:middle;font-size:12px;">atoms (dashes)</text><text class="lab" x="480.0" y="28.0" style="text-anchor:middle;font-size:14px;font-weight:700;">3 · Tertiary</text><text class="lab" x="470.0" y="125.0" style="text-anchor:middle;fill:#b45309;font-size:11px;font-weight:700;">S–S</text><text class="lab" x="480.0" y="222.0" style="text-anchor:middle;font-size:12px;font-weight:700;">whole chain folds in 3-D</text><text class="lab" x="480.0" y="238.0" style="text-anchor:middle;font-size:12px;">R groups interact: hydrophobic,</text><text class="lab" x="480.0" y="254.0" style="text-anchor:middle;font-size:12px;">H-bond, ionic, disulfide bridge</text><text class="lab" x="680.0" y="28.0" style="text-anchor:middle;font-size:14px;font-weight:700;">4 · Quaternary</text><text class="lab" x="680.0" y="222.0" style="text-anchor:middle;font-size:12px;font-weight:700;">2+ polypeptide chains</text><text class="lab" x="680.0" y="238.0" style="text-anchor:middle;font-size:12px;">hemoglobin = 4 chains</text><text class="lab" x="680.0" y="254.0" style="text-anchor:middle;font-size:12px;">collagen = 3 chains</text></svg>