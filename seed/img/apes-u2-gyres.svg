<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="625" fill="#ffffff"/><text x="450" y="26.0" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">Surface ocean currents in one ocean basin (map view, north is up)</text><rect x="20" y="50" width="150" height="520" rx="0" fill="#c8e6c9" stroke="none" stroke-width="1.5" opacity="1"/><text x="95" y="300.0" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">EAST coast</text><text x="95" y="315.9" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">of a continent</text><text x="95" y="331.7" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">(e.g. US East</text><text x="95" y="347.6" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">Coast, Brazil)</text><rect x="730" y="50" width="150" height="520" rx="0" fill="#ffe0b2" stroke="none" stroke-width="1.5" opacity="1"/><text x="805" y="300.0" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">WEST coast</text><text x="805" y="315.9" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">of a continent</text><text x="805" y="331.7" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">(California,</text><text x="805" y="347.6" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">Peru, NW</text><text x="805" y="363.4" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="bold">+ SW Africa)</text><rect x="170" y="50" width="560" height="520" rx="0" fill="#e3f2fd" stroke="none" stroke-width="1.5" opacity="1"/><line x1="170" y1="310" x2="730" y2="310" stroke="#555" stroke-width="1.5" stroke-dasharray="8 6"/><text x="450" y="304.0" font-size="12" fill="#555" text-anchor="middle">equator</text><line x1="200" y1="290" x2="200" y2="80" stroke="#c62828" stroke-width="5" marker-end="url(#ar)"/><line x1="200" y1="80" x2="690" y2="80" stroke="#1565c0" stroke-width="4" marker-end="url(#ab)"/><line x1="700" y1="80" x2="700" y2="290" stroke="#1565c0" stroke-width="5" marker-end="url(#ab)"/><line x1="690" y1="295" x2="210" y2="295" stroke="#c62828" stroke-width="4" marker-end="url(#ar)"/><text x="450" y="190.0" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">Northern Hemisphere gyre:</text><text x="450" y="210.7" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">CLOCKWISE</text><line x1="690" y1="325" x2="210" y2="325" stroke="#c62828" stroke-width="4" marker-end="url(#ar)"/><line x1="200" y1="330" x2="200" y2="540" stroke="#c62828" stroke-width="5" marker-end="url(#ar)"/><line x1="210" y1="545" x2="690" y2="545" stroke="#1565c0" stroke-width="4" marker-end="url(#ab)"/><line x1="700" y1="540" x2="700" y2="335" stroke="#1565c0" stroke-width="5" marker-end="url(#ab)"/><text x="450" y="430.0" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">Southern Hemisphere gyre:</text><text x="450" y="450.7" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">COUNTERCLOCKWISE</text><text x="212" y="140.0" font-size="12.5" fill="#b71c1c" text-anchor="start" font-weight="bold">WARM water from</text><text x="212" y="155.2" font-size="12.5" fill="#b71c1c" text-anchor="start" font-weight="bold">the equator runs</text><text x="212" y="170.5" font-size="12.5" fill="#b71c1c" text-anchor="start" font-weight="bold">up EAST coasts</text><text x="212" y="185.8" font-size="12.5" fill="#b71c1c" text-anchor="start" font-weight="bold">(warms the land)</text><text x="688" y="140.0" font-size="12.5" fill="#0d47a1" text-anchor="end" font-weight="bold">COLD water from</text><text x="688" y="155.2" font-size="12.5" fill="#0d47a1" text-anchor="end" font-weight="bold">the poles runs</text><text x="688" y="170.5" font-size="12.5" fill="#0d47a1" text-anchor="end" font-weight="bold">down WEST coasts</text><text x="688" y="185.8" font-size="12.5" fill="#0d47a1" text-anchor="end" font-weight="bold">(cools the land)</text><line x1="670" y1="270" x2="670" y2="230" stroke="#1565c0" stroke-width="2.5" marker-end="url(#ab)"/><line x1="670" y1="420" x2="670" y2="380" stroke="#1565c0" stroke-width="2.5" marker-end="url(#ab)"/><text x="660" y="262.0" font-size="12" fill="#0d47a1" text-anchor="end" font-weight="bold">UPWELLING</text><text x="660" y="412.0" font-size="12" fill="#0d47a1" text-anchor="end" font-weight="bold">UPWELLING</text><text x="450" y="592.0" font-size="12.5" fill="#333" text-anchor="middle">Upwelling on west coasts brings deep, nutrient-rich water up: big plankton + fish populations.</text><text x="450" y="610.0" font-size="12.5" fill="#333" text-anchor="middle">Gyres spin OPPOSITE to hurricanes (hurricanes: counterclockwise in the N. Hemisphere).</text></svg>