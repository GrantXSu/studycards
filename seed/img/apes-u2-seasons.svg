<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="960" height="560" fill="#ffffff"/><text x="480" y="26.0" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">Why we have seasons: Earth's axis is tilted 23.5° and always points the same way</text><ellipse cx="480" cy="270" rx="330" ry="160" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="480" cy="270" r="46" fill="#ffca28" stroke="#f9a825" stroke-width="3"/><text x="480" y="276.0" font-size="16" fill="#6d4c00" text-anchor="middle" font-weight="bold">SUN</text><circle cx="150" cy="270" r="32" fill="#42a5f5" stroke="#1565c0" stroke-width="2"/><path d="M 150.0 302.0 A 32 32 0 0 1 150.0 238.0 Z" fill="#0d2a4a" opacity=".55" transform="rotate(0)"/><line x1="131.65754282943868" y1="312.18476342171573" x2="168.34245717056132" y2="227.8152365782843" stroke="#222" stroke-width="2"/><text x="169.9374534462623" y="222.1" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">N</text><line x1="179.34592238032397" y1="282.7599702056079" x2="120.65407761967603" y2="257.2400297943921" stroke="#ffeb3b" stroke-width="1.5"/><text x="150" y="330.0" font-size="13" fill="#4a148c" text-anchor="middle" font-weight="bold">JUNE SOLSTICE (~June 21)</text><text x="150" y="348.0" font-size="11.5" fill="#333" text-anchor="middle">N. Hemisphere tilted TOWARD sun</text><text x="150" y="362.0" font-size="11.5" fill="#333" text-anchor="middle">sun overhead at 23.5° N (Tropic of Cancer)</text><text x="150" y="376.1" font-size="11.5" fill="#333" text-anchor="middle">longest day; summer starts in the north</text><circle cx="480" cy="430" r="32" fill="#42a5f5" stroke="#1565c0" stroke-width="2"/><path d="M 512.0 430.0 A 32 32 0 0 1 448.0 430.0 Z" fill="#0d2a4a" opacity=".55" transform="rotate(0)"/><line x1="461.6575428294387" y1="472.18476342171573" x2="498.3424571705613" y2="387.81523657828427" stroke="#222" stroke-width="2"/><text x="499.93745344626234" y="382.1" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">N</text><line x1="509.34592238032394" y1="442.7599702056079" x2="450.65407761967606" y2="417.2400297943921" stroke="#ffeb3b" stroke-width="1.5"/><text x="530" y="432.0" font-size="13" fill="#4a148c" text-anchor="start" font-weight="bold">SEPTEMBER EQUINOX (~Sept 22)</text><text x="530" y="450.0" font-size="11.5" fill="#333" text-anchor="start">sun overhead at the equator</text><text x="530" y="464.0" font-size="11.5" fill="#333" text-anchor="start">12 h day / 12 h night everywhere</text><text x="530" y="478.1" font-size="11.5" fill="#333" text-anchor="start">fall starts in the north</text><circle cx="810" cy="270" r="32" fill="#42a5f5" stroke="#1565c0" stroke-width="2"/><path d="M 810.0 238.0 A 32 32 0 0 1 810.0 302.0 Z" fill="#0d2a4a" opacity=".55" transform="rotate(0)"/><line x1="791.6575428294386" y1="312.18476342171573" x2="828.3424571705614" y2="227.8152365782843" stroke="#222" stroke-width="2"/><text x="829.9374534462623" y="222.1" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">N</text><line x1="839.3459223803239" y1="282.7599702056079" x2="780.6540776196761" y2="257.2400297943921" stroke="#ffeb3b" stroke-width="1.5"/><text x="810" y="330.0" font-size="13" fill="#4a148c" text-anchor="middle" font-weight="bold">DECEMBER SOLSTICE (~Dec 21)</text><text x="810" y="348.0" font-size="11.5" fill="#333" text-anchor="middle">N. Hemisphere tilted AWAY from sun</text><text x="810" y="362.0" font-size="11.5" fill="#333" text-anchor="middle">sun overhead at 23.5° S (Tropic of Capricorn)</text><text x="810" y="376.1" font-size="11.5" fill="#333" text-anchor="middle">shortest day; winter starts in the north</text><circle cx="480" cy="110" r="32" fill="#42a5f5" stroke="#1565c0" stroke-width="2"/><path d="M 448.0 110.0 A 32 32 0 0 1 512.0 110.0 Z" fill="#0d2a4a" opacity=".55" transform="rotate(0)"/><line x1="461.6575428294387" y1="152.1847634217157" x2="498.3424571705613" y2="67.8152365782843" stroke="#222" stroke-width="2"/><text x="499.93745344626234" y="62.1" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">N</text><line x1="509.34592238032394" y1="122.75997020560789" x2="450.65407761967606" y2="97.24002979439211" stroke="#ffeb3b" stroke-width="1.5"/><text x="530" y="90.0" font-size="13" fill="#4a148c" text-anchor="start" font-weight="bold">MARCH EQUINOX (~March 20)</text><text x="530" y="108.0" font-size="11.5" fill="#333" text-anchor="start">sun overhead at the equator</text><text x="530" y="122.0" font-size="11.5" fill="#333" text-anchor="start">12 h day / 12 h night everywhere</text><text x="530" y="136.1" font-size="11.5" fill="#333" text-anchor="start">spring starts in the north</text><text x="480" y="520.0" font-size="14" fill="#b71c1c" text-anchor="middle" font-weight="bold">Seasons come from the TILT (angle of the sun's rays + length of day), NOT from distance to the sun.</text><text x="480" y="542.0" font-size="12.5" fill="#333" text-anchor="middle">Key ideas: orbit on a plane (the ecliptic) | axis tilted 23.5° | axis stays parallel to itself | heat = angle of rays + day length</text></svg>