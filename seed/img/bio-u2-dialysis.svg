<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-label="Dialysis bag with glucose and starch in a beaker of water and iodine"><rect width="600" height="420" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Inter,sans-serif" fill="#1f2937"><path d="M90 70 V380 Q90 400 110 400 H490 Q510 400 510 380 V70" fill="rgba(234,179,8,.18)" stroke="#1f2937" stroke-width="3"/><line x1="90" y1="110" x2="510" y2="110" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><path d="M250 80 Q240 90 240 140 V320 Q240 360 300 360 Q360 360 360 320 V140 Q360 90 350 80" fill="#fff" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 4"/><path d="M245 80 H355" stroke="#1f2937" stroke-width="6"/><text x="300" y="210" font-size="14" text-anchor="middle" font-weight="700" fill="#1e3a8a" dominant-baseline="central">INSIDE BAG</text><text x="300" y="236" font-size="14" text-anchor="middle" font-weight="400" fill="#1f2937" dominant-baseline="central">15% glucose</text><text x="300" y="258" font-size="14" text-anchor="middle" font-weight="400" fill="#1f2937" dominant-baseline="central">1% starch</text><text x="300" y="280" font-size="14" text-anchor="middle" font-weight="400" fill="#1f2937" dominant-baseline="central">water</text><text x="160" y="220" font-size="14" text-anchor="middle" font-weight="700" fill="#92400e" dominant-baseline="central">BEAKER</text><text x="160" y="246" font-size="14" text-anchor="middle" font-weight="400" fill="#1f2937" dominant-baseline="central">water +</text><text x="160" y="268" font-size="14" text-anchor="middle" font-weight="400" fill="#1f2937" dominant-baseline="central">iodine (IKI)</text><text x="300" y="40" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937" dominant-baseline="central">Dialysis tubing: lets water, glucose, and IKI through, but NOT starch</text></g></svg>