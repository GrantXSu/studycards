<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" width="900" height="495" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="agr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="900" height="495" fill="#ffffff"/><text x="450" y="26.0" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">Thermohaline circulation: the "Great Ocean Conveyor Belt"</text><rect x="40" y="60" width="820" height="300" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5" opacity="1"/><path d="M 120 110 C 300 90, 520 90, 700 105" stroke="#c62828" stroke-width="7" fill="none" marker-end="url(#ar)"/><text x="410" y="85.0" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="bold">warm, shallow surface current (Gulf Stream) heads to the North Atlantic</text><line x1="740" y1="120" x2="740" y2="290" stroke="#1565c0" stroke-width="7" marker-end="url(#ab)"/><text x="755" y="180.0" font-size="14" fill="#0d47a1" text-anchor="start" font-weight="bold">cold + SALTY</text><text x="755" y="197.1" font-size="14" fill="#0d47a1" text-anchor="start" font-weight="bold">= DENSE</text><text x="755" y="214.2" font-size="14" fill="#0d47a1" text-anchor="start" font-weight="bold">= SINKS</text><path d="M 720 315 C 520 330, 300 330, 140 310" stroke="#1565c0" stroke-width="7" fill="none" marker-end="url(#ab)"/><text x="430" y="345.0" font-size="13" fill="#0d47a1" text-anchor="middle" font-weight="bold">cold, deep current crawls along the bottom past Antarctica</text><line x1="110" y1="290" x2="110" y2="125" stroke="#c62828" stroke-width="7" marker-end="url(#ar)"/><text x="124" y="210.0" font-size="13" fill="#b71c1c" text-anchor="start" font-weight="bold">rises + warms in</text><text x="124" y="225.9" font-size="13" fill="#b71c1c" text-anchor="start" font-weight="bold">Indian + Pacific</text><text x="762" y="240.0" font-size="10.5" fill="#555" text-anchor="start">(ice forms +</text><text x="762" y="252.8" font-size="10.5" fill="#555" text-anchor="start">water evaporates,</text><text x="762" y="265.6" font-size="10.5" fill="#555" text-anchor="start">leaving salt)</text><text x="450" y="390.0" font-size="13.5" fill="#333" text-anchor="middle">Moves heat around the world; one loop takes hundreds of years.  Gulf Stream keeps England warmer than Newfoundland.</text><rect x="60" y="410" width="780" height="70" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5" opacity="1"/><text x="450" y="434.0" font-size="12.5" fill="#bf360c" text-anchor="middle" font-weight="bold">Climate change risk: Greenland ice melts, adding FRESH water. Less salty = less dense = it stops sinking,</text><text x="450" y="456.0" font-size="12.5" fill="#bf360c" text-anchor="middle" font-weight="bold">so the conveyor slows or shuts down, the Gulf Stream weakens, and western Europe gets much COLDER.</text></svg>