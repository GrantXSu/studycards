="440.0" y="178.0" font-size="16" font-weight="800" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Proton</text><text x="550.0" y="178.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">p⁺</text><text x="630.0" y="178.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">1 amu</text><text x="720.0" y="178.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+1</text><text x="795.0" y="178.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">nucleus</text><rect x="425" y="204" width="530" height="50" rx="8" fill="#f1f5f9"/><text x="440.0" y="236.0" font-size="16" font-weight="800" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Neutron</text><text x="550.0" y="236.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">n⁰</text><text x="630.0" y="236.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">1 amu</text><text x="720.0" y="236.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">0</text><text x="795.0" y="236.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">nucleus</text><rect x="425" y="262" width="530" height="50" rx="8" fill="#dbeafe"/><text x="440.0" y="294.0" font-size="16" font-weight="800" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Electron</text><text x="550.0" y="294.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">e⁻</text><text x="630.0" y="294.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">≈ 0 amu</text><text x="720.0" y="294.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−1</text><text x="795.0" y="294.0" font-size="16" font-weight="600" text-anchor="start" fill="#0f172a" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">outside nucleus</text><text x="690.0" y="375.0" font-size="14" font-weight="600" text-anchor="middle" fill="#475569" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">amu = atomic mass unit</text></svg>